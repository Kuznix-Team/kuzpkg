name: Build kuzpkg packages

# Deliberately scheduled once per day.
# There are no push, pull_request, or workflow_dispatch triggers here.
on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ============================================================
  # DEBIAN PACKAGES
  #
  # Native Ubuntu:
  #   Ubuntu 24.04 x86_64
  #   Ubuntu 26.04 x86_64
  #   Ubuntu 26.04 arm64
  #
  # Docker Debian:
  #   Debian 12 x86_64
  #   Debian 12 arm64
  #   Debian 13 x86_64
  #   Debian 13 arm64
  #   Debian testing x86_64
  #   Debian testing arm64
  #   Debian unstable x86_64
  #   Debian unstable arm64
  # ============================================================

  deb:
    name: .deb - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64

          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates dpkg-dev
          command -v docker >/dev/null
          docker --version

      - name: Build native Ubuntu package
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            asciidoc \
            xmlto \
            ca-certificates \
            git

          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          [ -n "$tag" ] || tag='0.0.0'

          safe_tag="$(printf '%s' "$tag" | sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g')"
          deb_version="$(printf '%s' "$tag" | sed 's/^v//; s/[^A-Za-z0-9.+~-]/./g')"

          rm -rf build staging deb-root dist
          mkdir -p dist deb-root/DEBIAN deb-root/usr

          meson setup build \
            --buildtype=release \
            --prefix=/usr

          meson compile -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a staging/usr/. deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc
            cp -a staging/etc/. deb-root/etc/
          fi

          cat > deb-root/DEBIAN/control <<EOF
          Package: kuzpkg
          Version: ${deb_version}
          Section: admin
          Priority: optional
          Architecture: ${PACKAGE_ARCH}
          Maintainer: Kuznix Team
          Description: kuzpkg package manager
           Package manager for Kuznix Linux.
          EOF

          deb_file="dist/kuzpkg-${safe_tag}-${TARGET_NAME}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$deb_file"

          dpkg-deb --info "$deb_file"

      - name: Build Debian Docker package
        if: matrix.mode == 'docker'
        env:
          TARGET_NAME: ${{ matrix.name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          DEBIAN_IMAGE: ${{ matrix.image }}
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                asciidoc \
                xmlto \
                ca-certificates \
                git

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag="0.0.0"

              safe_tag="$(printf "%s" "$tag" | sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g")"
              deb_version="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9.+~-]/./g")"

              rm -rf build staging deb-root dist
              mkdir -p dist deb-root/DEBIAN deb-root/usr

              meson setup build \
                --buildtype=release \
                --prefix=/usr

              meson compile -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a staging/usr/. deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc
                cp -a staging/etc/. deb-root/etc/
              fi

              cat > deb-root/DEBIAN/control <<EOF
              Package: kuzpkg
              Version: ${deb_version}
              Section: admin
              Priority: optional
              Architecture: ${PACKAGE_ARCH}
              Maintainer: Kuznix Team
              Description: kuzpkg package manager
               Package manager for Kuznix Linux.
              EOF

              deb_file="dist/kuzpkg-${safe_tag}-${TARGET_NAME}.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$deb_file"

              dpkg-deb --info "$deb_file"
            '

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # DEBIAN PACKAGES - O3
  # Same Debian/Ubuntu matrix, with -Denable-o3=true.
  # ============================================================

  deb-o3:
    name: .deb O3 - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64

          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates dpkg-dev
          command -v docker >/dev/null
          docker --version

      - name: Build native Ubuntu O3 package
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            asciidoc \
            xmlto \
            ca-certificates \
            git

          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          [ -n "$tag" ] || tag='0.0.0'

          safe_tag="$(printf '%s' "$tag" | sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g')"
          deb_version="$(printf '%s' "$tag" | sed 's/^v//; s/[^A-Za-z0-9.+~-]/./g')"

          rm -rf build staging deb-root dist
          mkdir -p dist deb-root/DEBIAN deb-root/usr

          meson setup build \
            --buildtype=release \
            --prefix=/usr \
            -Denable-o3=true

          meson compile -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a staging/usr/. deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc
            cp -a staging/etc/. deb-root/etc/
          fi

          cat > deb-root/DEBIAN/control <<EOF
          Package: kuzpkg
          Version: ${deb_version}
          Section: admin
          Priority: optional
          Architecture: ${PACKAGE_ARCH}
          Maintainer: Kuznix Team
          Description: kuzpkg package manager
           Package manager for Kuznix Linux (O3 build).
          EOF

          deb_file="dist/kuzpkg-${safe_tag}-${TARGET_NAME}-o3.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$deb_file"

          dpkg-deb --info "$deb_file"

      - name: Build Debian Docker O3 package
        if: matrix.mode == 'docker'
        env:
          TARGET_NAME: ${{ matrix.name }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          DEBIAN_IMAGE: ${{ matrix.image }}
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                asciidoc \
                xmlto \
                ca-certificates \
                git

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag="0.0.0"

              safe_tag="$(printf "%s" "$tag" | sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g")"
              deb_version="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9.+~-]/./g")"

              rm -rf build staging deb-root dist
              mkdir -p dist deb-root/DEBIAN deb-root/usr

              meson setup build \
                --buildtype=release \
                --prefix=/usr \
                -Denable-o3=true

              meson compile -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a staging/usr/. deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc
                cp -a staging/etc/. deb-root/etc/
              fi

              cat > deb-root/DEBIAN/control <<EOF
              Package: kuzpkg
              Version: ${deb_version}
              Section: admin
              Priority: optional
              Architecture: ${PACKAGE_ARCH}
              Maintainer: Kuznix Team
              Description: kuzpkg package manager
               Package manager for Kuznix Linux (O3 build).
              EOF

              deb_file="dist/kuzpkg-${safe_tag}-${TARGET_NAME}-o3.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$deb_file"

              dpkg-deb --info "$deb_file"
            '

      - name: Upload Debian O3 package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-o3-${{ matrix.name }}
          path: dist/*-o3.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # FEDORA RPM PACKAGES
  # Fedora 43, Fedora 44 (latest), Rawhide.
  # Every version has x86_64 and native arm64 variants.
  # ============================================================

  rpm:
    name: .rpm - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          command -v docker >/dev/null
          docker --version

      - name: Build RPM
        env:
          TARGET_NAME: ${{ matrix.name }}
          FEDORA_IMAGE: ${{ matrix.image }}
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '
              dnf -y update
              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                asciidoc \
                xmlto \
                rpm-build \
                rpmdevtools

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag="0.0.0"

              safe_tag="$(printf "%s" "$tag" | sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g")"
              rpm_version="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9._+]/./g")"

              rm -rf build staging rpm-build dist
              mkdir -p \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup build \
                --buildtype=release \
                --prefix=/usr

              meson compile -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cat > rpm-build/SPECS/kuzpkg.spec <<EOF
              Name: kuzpkg
              Version: ${rpm_version}
              Release: 1%{?dist}
              Summary: kuzpkg package manager
              License: GPLv2+

              %description
              Package manager for Kuznix Linux.

              %prep

              %build

              %install
              rm -rf %{buildroot}
              mkdir -p %{buildroot}
              cp -a /workspace/staging/. %{buildroot}/

              %files
              /usr/*
              %config(noreplace) /etc/kuzpkg.conf
              %config(noreplace) /etc/makepkg.conf
              %config(noreplace) /etc/makepkg.conf.d/fortran.conf
              %config(noreplace) /etc/makepkg.conf.d/rust.conf

              %changelog
              * $(date -u "+%a %b %d %Y") Kuznix Team - ${rpm_version}-1
              - Daily Fedora build
              EOF

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              rpm_file="$(find rpm-build/RPMS -type f -name "*.rpm" | head -n1)"
              test -n "$rpm_file"
              cp "$rpm_file" "dist/kuzpkg-${safe_tag}-${TARGET_NAME}.rpm"
              rpm -qip "$rpm_file"
            '

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # FEDORA RPM PACKAGES - O3
  # ============================================================

  rpm-o3:
    name: .rpm O3 - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide

