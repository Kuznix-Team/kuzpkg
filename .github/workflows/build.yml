            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
