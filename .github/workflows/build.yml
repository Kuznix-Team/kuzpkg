            runner: ubuntu-26.04-arm
            image: fedora:43
            arch: aarch64

          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
            arch: x86_64

          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
