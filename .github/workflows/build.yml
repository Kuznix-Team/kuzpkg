name: Build kuzpkg packages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  # ============================================================
  # .DEB PACKAGES
  # Ubuntu 24.04
  # Ubuntu 26.04
  # Ubuntu 26.04 ARM
  # Debian 13
  # Debian testing
  # Debian unstable
  # ============================================================

  deb:
    name: .deb - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            container: ""
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            container: ""
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            container: ""
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            container: debian:13
            arch: amd64

          - name: debian-testing
            runner: ubuntu-24.04
            container: debian:testing
            arch: amd64

          - name: debian-unstable
            runner: ubuntu-24.04
            container: debian:unstable
            arch: amd64

    container: ${{ matrix.container != '' && matrix.container || null }}

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update

            apt-get install -y \
              build-essential \
              meson \
              ninja-build \
              pkg-config \
              zstd \
              libarchive-dev \
              libcurl4-gnutls-dev \
              libgpgme-dev \
              libssl-dev \
              nettle-dev \
              libseccomp-dev \
              file \
              gettext \
              asciidoc \
              xmlto \
              dpkg-dev \
              ca-certificates \
              git
          else
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              meson \
              ninja-build \
              pkg-config \
              zstd \
              libarchive-dev \
              libcurl4-gnutls-dev \
              libgpgme-dev \
              libssl-dev \
              nettle-dev \
              libseccomp-dev \
              file \
              gettext \
              asciidoc \
              xmlto \
              dpkg-dev \
              ca-certificates \
              git
          fi

      - name: Detect version and architecture
        id: info
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi

          SAFE_TAG="$(
            printf '%s' "$LATEST_TAG" |
              sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          DEB_VERSION="$(
            printf '%s' "$LATEST_TAG" |
              sed 's/^v//; s/[^A-Za-z0-9.+~-]/./g'
          )"

          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Meson
        run: |
          set -euxo pipefail

          meson setup build \
            --buildtype=release \
            --prefix=/usr

      - name: Build kuzpkg
        run: |
          set -euxo pipefail
          meson compile -C build

      - name: Install into staging
        run: |
          set -euxo pipefail

          rm -rf staging

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

      - name: Build Debian package
        shell: bash
        run: |
          set -euxo pipefail

          PKGROOT="$PWD/deb-root"
          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/DEBIAN" \
            "$PKGROOT/usr"

          cp -a staging/usr/. "$PKGROOT/usr/"

          if [ -d staging/etc ]; then
            mkdir -p "$PKGROOT/etc"
            cp -a staging/etc/. "$PKGROOT/etc/"
          fi

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: kuzpkg
          Version: ${{ steps.info.outputs.deb_version }}
          Section: admin
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Kuznix Team
          Description: kuzpkg package manager
           Package manager for Kuznix Linux.
          EOF

          mkdir -p dist

          dpkg-deb \
            --build \
            --root-owner-group \
            "$PKGROOT" \
            "dist/kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ matrix.name }}.deb"

      - name: Validate Debian package
        run: |
          set -euxo pipefail

          dpkg-deb --info \
            "dist/kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ matrix.name }}.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .DEB O3 PACKAGES
  # Same targets, but -Denable-o3=true
  # ============================================================

  deb-o3:
    name: .deb O3 - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            container: ""
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            container: ""
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            container: ""
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            container: debian:13
            arch: amd64

          - name: debian-testing
            runner: ubuntu-24.04
            container: debian:testing
            arch: amd64

          - name: debian-unstable
            runner: ubuntu-24.04
            container: debian:unstable
            arch: amd64

    container: ${{ matrix.container != '' && matrix.container || null }}

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update

            apt-get install -y \
              build-essential \
              meson \
              ninja-build \
              pkg-config \
              zstd \
              libarchive-dev \
              libcurl4-gnutls-dev \
              libgpgme-dev \
              libssl-dev \
              nettle-dev \
              libseccomp-dev \
              file \
              gettext \
              asciidoc \
              xmlto \
              dpkg-dev \
              ca-certificates \
              git
          else
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              meson \
              ninja-build \
              pkg-config \
              zstd \
              libarchive-dev \
              libcurl4-gnutls-dev \
              libgpgme-dev \
              libssl-dev \
              nettle-dev \
              libseccomp-dev \
              file \
              gettext \
              asciidoc \
              xmlto \
              dpkg-dev \
              ca-certificates \
              git
          fi

      - name: Detect version
        id: info
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          [ -n "$LATEST_TAG" ] || LATEST_TAG="0.0.0"

          SAFE_TAG="$(
            printf '%s' "$LATEST_TAG" |
              sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          DEB_VERSION="$(
            printf '%s' "$LATEST_TAG" |
              sed 's/^v//; s/[^A-Za-z0-9.+~-]/./g'
          )"

          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Meson with O3
        run: |
          set -euxo pipefail

          meson setup build \
            --buildtype=release \
            --prefix=/usr \
            -Denable-o3=true

      - name: Build kuzpkg O3
        run: |
          set -euxo pipefail
          meson compile -C build

      - name: Install into staging
        run: |
          set -euxo pipefail

          rm -rf staging

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

      - name: Build Debian O3 package
        shell: bash
        run: |
          set -euxo pipefail

          PKGROOT="$PWD/deb-root"
          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/DEBIAN" \
            "$PKGROOT/usr"

          cp -a staging/usr/. "$PKGROOT/usr/"

          if [ -d staging/etc ]; then
            mkdir -p "$PKGROOT/etc"
            cp -a staging/etc/. "$PKGROOT/etc/"
          fi

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: kuzpkg
          Version: ${{ steps.info.outputs.deb_version }}
          Section: admin
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Kuznix Team
          Description: kuzpkg package manager
           Package manager for Kuznix Linux (O3 build).
          EOF

          mkdir -p dist

          dpkg-deb \
            --build \
            --root-owner-group \
            "$PKGROOT" \
            "dist/kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ matrix.name }}-o3.deb"

      - name: Validate package
        run: |
          set -euxo pipefail

          dpkg-deb --info \
            "dist/kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ matrix.name }}-o3.deb"

      - name: Upload Debian O3 package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-o3-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .RPM PACKAGES
  # Fedora 43
  # Fedora 44
  # Fedora Rawhide
  # ============================================================

  rpm:
    name: .rpm - ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-43
            image: fedora:43
            arch: x86_64

          - name: fedora-44
            image: fedora:44
            arch: x86_64

          - name: fedora-rawhide
            image: fedora:rawhide
            arch: x86_64

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Docker
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Build RPM
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                asciidoc \
                xmlto \
                rpm-build \
                rpmdevtools

              LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$LATEST_TAG" ] || LATEST_TAG="0.0.0"

              SAFE_TAG="$(
                printf "%s" "$LATEST_TAG" |
                  sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g"
              )"

              RPM_VERSION="$(
                printf "%s" "$LATEST_TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              meson setup build \
                --buildtype=release \
                --prefix=/usr

              meson compile -C build

              rm -rf staging

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              mkdir -p \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS

              CHANGELOG_DATE="$(date -u "+%a %b %d %Y")"

              cat > rpm-build/SPECS/kuzpkg.spec <<EOF
              Name:           kuzpkg
              Version:        ${RPM_VERSION}
              Release:        1%{?dist}
              Summary:        kuzpkg package manager
              License:        GPLv2+
              BuildArch:      x86_64

              %description
              Package manager for Kuznix Linux.

              %prep

              %build

              %install
              rm -rf %{buildroot}
              mkdir -p %{buildroot}
              cp -a /workspace/staging/. %{buildroot}/

              %files
              /usr/*
              %config(noreplace) /etc/kuzpkg.conf
              %config(noreplace) /etc/makepkg.conf
              %config(noreplace) /etc/makepkg.conf.d/fortran.conf
              %config(noreplace) /etc/makepkg.conf.d/rust.conf

              %changelog
              * ${CHANGELOG_DATE} Kuznix Team - ${RPM_VERSION}-1
              - Fedora RPM build
              EOF

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                /workspace/rpm-build/SPECS/kuzpkg.spec

              mkdir -p dist

              RPM_FILE="$(find rpm-build/RPMS -type f -name "*.rpm" | head -n 1)"

              test -n "$RPM_FILE"

              cp "$RPM_FILE" \
                "dist/kuzpkg-${SAFE_TAG}-${{ matrix.name }}.rpm"

              rpm -qip "$RPM_FILE"
            '

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .RPM O3 PACKAGES
  # Fedora 43
  # Fedora 44
  # Fedora Rawhide
  # ============================================================

  rpm-o3:
    name: .rpm O3 - ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-43
            image: fedora:43

          - name: fedora-44
            image: fedora:44

          - name: fedora-rawhide
            image: fedora:rawhide

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Docker
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Build RPM O3
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                asciidoc \
                xmlto \
                rpm-build \
                rpmdevtools

              LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$LATEST_TAG" ] || LATEST_TAG="0.0.0"

              SAFE_TAG="$(
                printf "%s" "$LATEST_TAG" |
                  sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g"
              )"

              RPM_VERSION="$(
                printf "%s" "$LATEST_TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              meson setup build \
                --buildtype=release \
                --prefix=/usr \
                -Denable-o3=true

              meson compile -C build

              rm -rf staging

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              mkdir -p \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS

              CHANGELOG_DATE="$(date -u "+%a %b %d %Y")"

              cat > rpm-build/SPECS/kuzpkg.spec <<EOF
              Name:           kuzpkg
              Version:        ${RPM_VERSION}
              Release:        1%{?dist}
              Summary:        kuzpkg package manager
              License:        GPLv2+
              BuildArch:      x86_64

              %description
              Package manager for Kuznix Linux.

              %prep

              %build

              %install
              rm -rf %{buildroot}
              mkdir -p %{buildroot}
              cp -a /workspace/staging/. %{buildroot}/

              %files
              /usr/*
              %config(noreplace) /etc/kuzpkg.conf
              %config(noreplace) /etc/makepkg.conf
              %config(noreplace) /etc/makepkg.conf.d/fortran.conf
              %config(noreplace) /etc/makepkg.conf.d/rust.conf

              %changelog
              * ${CHANGELOG_DATE} Kuznix Team - ${RPM_VERSION}-1
              - Fedora RPM O3 build
              EOF

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                /workspace/rpm-build/SPECS/kuzpkg.spec

              mkdir -p dist

              RPM_FILE="$(find rpm-build/RPMS -type f -name "*.rpm" | head -n 1)"

              test -n "$RPM_FILE"

              cp "$RPM_FILE" \
                "dist/kuzpkg-${SAFE_TAG}-${{ matrix.name }}-o3.rpm"

              rpm -qip "$RPM_FILE"
            '

      - name: Upload RPM O3
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-o3-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .PKG.TAR.ZST
  # Arch Linux
  # ============================================================

  pkg-tar-zst:
    name: .pkg.tar.zst - Arch Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Docker
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Build Arch package
        run: |
          set -euxo pipefail

          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext \
                asciidoc \
                git

              LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$LATEST_TAG" ] || LATEST_TAG="0.0.0"

              PKGVER="$(
                printf "%s" "$LATEST_TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              cat > PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${PKGVER}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=("x86_64")
              license=("GPL")
              depends=(
                "bash"
                "libarchive"
                "curl"
                "gpgme"
                "openssl"
                "nettle"
                "libseccomp"
              )

              build() {
                  meson setup build \
                    --buildtype=release \
                    --prefix=/usr
                  meson compile -C build
              }

              package() {
                  meson install \
                    -C build \
                    --destdir "$pkgdir" \
                    --no-rebuild \
                    --strip
              }
              EOF

              useradd -m builder
              chown -R builder:builder /workspace

              su builder -c "
                cd /workspace
                makepkg \
                  --syncdeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              chown -R root:root /workspace

              mkdir -p dist

              PKG_FILE="$(find /workspace -maxdepth 1 -type f -name "kuzpkg-*.pkg.tar.zst" | head -n 1)"

              test -n "$PKG_FILE"

              cp "$PKG_FILE" \
                "dist/$(basename "$PKG_FILE")"
            '

      - name: Validate Arch package
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD/dist:/dist" \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm zstd

              PKG="$(find /dist -type f -name "*.pkg.tar.zst" | head -n 1)"

              test -n "$PKG"

              tar -tf "$PKG" >/dev/null
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-pkg-tar-zst
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .PKG.TAR.ZST O3
  # Arch Linux
  # ============================================================

  pkg-tar-zst-o3:
    name: .pkg.tar.zst O3 - Arch Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Docker
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Build Arch O3 package
        run: |
          set -euxo pipefail

          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext \
                asciidoc \
                git

              LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$LATEST_TAG" ] || LATEST_TAG="0.0.0"

              PKGVER="$(
                printf "%s" "$LATEST_TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              cat > PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${PKGVER}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=("x86_64")
              license=("GPL")
              depends=(
                "bash"
                "libarchive"
                "curl"
                "gpgme"
                "openssl"
                "nettle"
                "libseccomp"
              )

              build() {
                  meson setup build \
                    --buildtype=release \
                    --prefix=/usr \
                    -Denable-o3=true
                  meson compile -C build
              }

              package() {
                  meson install \
                    -C build \
                    --destdir "$pkgdir" \
                    --no-rebuild \
                    --strip
              }
              EOF

              useradd -m builder
              chown -R builder:builder /workspace

              su builder -c "
                cd /workspace
                makepkg \
                  --syncdeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              chown -R root:root /workspace

              mkdir -p dist

              PKG_FILE="$(find /workspace -maxdepth 1 -type f -name "kuzpkg-*.pkg.tar.zst" | head -n 1)"

              test -n "$PKG_FILE"

