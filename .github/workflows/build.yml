name: Build kuzpkg packages

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  # ============================================================
  # .DEB
  # ============================================================

  deb:
    name: ".deb - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64

          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            git tag --list
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          echo "Git tag: $GIT_TAG"
          echo "Package version: $PACKAGE_VERSION"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            dpkg-dev

          if [ "${{ matrix.mode }}" = "docker" ]; then
            command -v docker
            docker --version
          fi

      - name: Install native dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            ca-certificates \
            git

      - name: Build native .deb
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            deb-root/usr \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr

          meson compile \
            -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a \
            staging/usr/. \
            deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc

            cp -a \
              staging/etc/. \
              deb-root/etc/
          fi

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${PACKAGE_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb \
            --info \
            "$DEB_FILE"

          test -f "$DEB_FILE"

      - name: Build Debian Docker .deb
        if: matrix.mode == 'docker'
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e GIT_TAG \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                dpkg-dev

              echo "Git tag: ${GIT_TAG}"
              echo "Package version: ${PACKAGE_VERSION}"

              rm -rf \
                build \
                staging \
                deb-root \
                dist

              mkdir -p \
                build \
                staging \
                deb-root/DEBIAN \
                deb-root/usr \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a \
                staging/usr/. \
                deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc

                cp -a \
                  staging/etc/. \
                  deb-root/etc/
              fi

              printf "%s\n" \
                "Package: kuzpkg" \
                "Version: ${PACKAGE_VERSION}" \
                "Section: admin" \
                "Priority: optional" \
                "Architecture: ${TARGET_ARCH}" \
                "Maintainer: Kuznix Team" \
                "Description: kuzpkg package manager" \
                " Package manager for Kuznix Linux." \
                > deb-root/DEBIAN/control

              DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$DEB_FILE"

              dpkg-deb \
                --info \
                "$DEB_FILE"

              test -f "$DEB_FILE"
            '

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .DEB O3
  # ============================================================

  deb-o3:
    name: ".deb O3 - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64

          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"
          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $GIT_TAG"
          echo "Package version: $PACKAGE_VERSION"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            dpkg-dev

          if [ "${{ matrix.mode }}" = "docker" ]; then
            command -v docker
            docker --version
          fi

      - name: Install native O3 dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            ca-certificates \
            git

      - name: Build native .deb O3
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            deb-root/usr \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr \
            -Denable-o3=true

          meson compile \
            -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a \
            staging/usr/. \
            deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc

            cp -a \
              staging/etc/. \
              deb-root/etc/
          fi

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${PACKAGE_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux (O3 build)." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}-o3.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb \
            --info \
            "$DEB_FILE"

      - name: Build Debian Docker .deb O3
        if: matrix.mode == 'docker'
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                dpkg-dev

              rm -rf \
                build \
                staging \
                deb-root \
                dist

              mkdir -p \
                build \
                staging \
                deb-root/DEBIAN \
                deb-root/usr \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr \
                -Denable-o3=true

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a \
                staging/usr/. \
                deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc
                cp -a staging/etc/. deb-root/etc/
              fi

              printf "%s\n" \
                "Package: kuzpkg" \
                "Version: ${PACKAGE_VERSION}" \
                "Section: admin" \
                "Priority: optional" \
                "Architecture: ${TARGET_ARCH}" \
                "Maintainer: Kuznix Team" \
                "Description: kuzpkg package manager" \
                " Package manager for Kuznix Linux (O3 build)." \
                > deb-root/DEBIAN/control

              DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}-o3.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$DEB_FILE"

              dpkg-deb --info "$DEB_FILE"
            '

      - name: Upload .deb O3
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}-o3
          path: dist/*-o3.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .RPM
  # ============================================================

  rpm:
    name: ".rpm - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
            arch: x86_64

          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
            arch: aarch64

          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
            arch: x86_64

          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
            arch: aarch64

          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
            arch: x86_64

          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide
            arch: aarch64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          RPM_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              sed 's/-/~/g'
          ).${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "rpm_version=$RPM_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          command -v docker
          docker --version

      - name: Build RPM
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e RPM_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '

              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                rpm-build \
                rpmdevtools

              rm -rf \
                build \
                staging \
                rpm-build \
                dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              printf "%s\n" \
                "Name:           kuzpkg" \
                "Version:        ${RPM_VERSION}" \
                "Release:        1%{?dist}" \
                "Summary:        kuzpkg package manager" \
                "License:        GPLv2+" \
                "ExclusiveArch:  ${TARGET_ARCH}" \
                "" \
                "%description" \
                "Package manager for Kuznix Linux." \
                "" \
                "%prep" \
                "" \
                "%build" \
                "" \
                "%install" \
                "rm -rf %{buildroot}" \
                "mkdir -p %{buildroot}" \
                "cp -a /workspace/staging/. %{buildroot}/" \
                "" \
                "%files" \
                "/usr/*" \
                "%config(noreplace) /etc/kuzpkg.conf" \
                "%config(noreplace) /etc/makepkg.conf" \
                "%config(noreplace) /etc/makepkg.conf.d/fortran.conf" \
                "%config(noreplace) /etc/makepkg.conf.d/rust.conf" \
                "" \
                "%changelog" \
                "* $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1" \
                "- Daily Fedora build" \
                > rpm-build/SPECS/kuzpkg.spec

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find \
                  rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: RPM was not produced."

                find \
                  rpm-build/RPMS \
                  -type f \
                  -print

                exit 1
              fi

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.rpm"

              cp \
                "$RPM_FILE" \
                "$OUTPUT"

              rpm -qip "$RPM_FILE"

              test \
                -f \
                "$OUTPUT"
            '

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # RPM O3
  # ============================================================

  rpm-o3:
    name: ".rpm O3 - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
            arch: x86_64

          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
            arch: aarch64

          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
            arch: x86_64

          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
            arch: aarch64

          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
            arch: x86_64

          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide
            arch: aarch64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          RPM_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              sed 's/-/~/g'
          ).${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "package_version=$PACKAGE_VERSION"
            echo "rpm_version=$RPM_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          command -v docker
          docker --version

      - name: Build RPM O3
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e RPM_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '

              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                rpm-build \
                rpmdevtools

              rm -rf \
                build \
                staging \
                rpm-build \
                dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr \
                -Denable-o3=true

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              printf "%s\n" \
                "Name:           kuzpkg" \
                "Version:        ${RPM_VERSION}" \
                "Release:        1%{?dist}" \
                "Summary:        kuzpkg package manager" \
                "License:        GPLv2+" \
                "ExclusiveArch:  ${TARGET_ARCH}" \
                "" \
                "%description" \
                "Package manager for Kuznix Linux (O3 build)." \
                "" \
                "%prep" \
                "" \
                "%build" \
                "" \
                "%install" \
                "rm -rf %{buildroot}" \
                "mkdir -p %{buildroot}" \
                "cp -a /workspace/staging/. %{buildroot}/" \
                "" \
                "%files" \
                "/usr/*" \
                "%config(noreplace) /etc/kuzpkg.conf" \
                "%config(noreplace) /etc/makepkg.conf" \
                "%config(noreplace) /etc/makepkg.conf.d/fortran.conf" \
                "%config(noreplace) /etc/makepkg.conf.d/rust.conf" \
                "" \
                "%changelog" \
                "* $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1" \
                "- Daily Fedora O3 build" \
                > rpm-build/SPECS/kuzpkg.spec

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find \
                  rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: RPM O3 was not produced."

                find \
                  rpm-build/RPMS \
                  -type f \
                  -print

                exit 1
              fi

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}-o3.rpm"

              cp \
                "$RPM_FILE" \
                "$OUTPUT"

              rpm -qip "$RPM_FILE"

              test \
                -f \
                "$OUTPUT"
            '

      - name: Upload RPM O3
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}-o3
          path: dist/*-o3.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


