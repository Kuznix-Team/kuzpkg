  # ============================================================
  # .KUZPKG.TAR.ZST
  #
  # Bootstrap:
  #   1. Build kuzpkg with system make tools
  #   2. Install kuzpkg into /tmp/kuzpkg-install
  #   3. Use kuzpkg's own makepkg
  #   4. Build kuzpkg again through that makepkg
  # ============================================================

  kuzpkg-tar-zst:
    name: ".kuzpkg.tar.zst - Kuzpkg makepkg"
    runs-on: ubuntu-24.04

    steps:

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates

          docker --version

      - name: Build self-hosted Kuzpkg package
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            -v "$PWD/dist:/export" \
            archlinux:latest \
            bash -euxo pipefail -c '

              # ------------------------------------------------
              # Host build dependencies
              # ------------------------------------------------

              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext

              rm -rf \
                /tmp/kuzpkg \
                /tmp/kuzpkg-install \
                /tmp/package-build \
                /tmp/kuzpkg-source.tar.gz

              mkdir -p \
                /tmp/package-build

              # ------------------------------------------------
              # Clone repository
              # ------------------------------------------------

              git clone \
                --filter=blob:none \
                https://github.com/Kuznix-Team/kuzpkg.git \
                /tmp/kuzpkg

              cd /tmp/kuzpkg

              git fetch \
                --tags \
                origin

              GIT_TAG="$(
                git tag \
                  --sort=-creatordate |
                head -n 1
              )"

              if [ -z "$GIT_TAG" ]; then
                GIT_TAG="$(
                  git describe \
                    --tags \
                    --abbrev=0 \
                    2>/dev/null || true
                )"
              fi

              if [ -z "$GIT_TAG" ]; then
                echo "ERROR: Repository has no Git tag."
                git tag --list
                exit 1
              fi

              TAG_VERSION="${GIT_TAG#v}"
              DATE_VERSION="$(date -u +%Y%m%d)"

              ARCH_TAG_VERSION="$(
                printf "%s" "$TAG_VERSION" |
                  tr "-" "."
              )"

              ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

              echo "Git tag: ${GIT_TAG}"
              echo "Arch pkgver: ${ARCH_PKGVER}"

              test \
                -f \
                /tmp/kuzpkg/meson.build

              # ------------------------------------------------
              # Bootstrap kuzpkg with system Meson
              # ------------------------------------------------

              meson setup \
                /tmp/kuzpkg/source-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C /tmp/kuzpkg/source-build

              meson install \
                -C /tmp/kuzpkg/source-build \
                --destdir /tmp/kuzpkg-install \
                --no-rebuild \
                --strip

              MAKEPKG_PATH="/tmp/kuzpkg-install/usr/bin/makepkg"

              if [ ! -x "$MAKEPKG_PATH" ]; then
                echo "ERROR: Kuzpkg makepkg was not installed."

                find \
                  /tmp/kuzpkg-install \
                  -maxdepth 5 \
                  \( -type f -o -type l \) \
                  -print

                exit 1
              fi

              echo "Bootstrapped Kuzpkg makepkg:"
              "$MAKEPKG_PATH" --version || true

              # ------------------------------------------------
              # IMPORTANT:
              #
              # The source archive is separate from the build
              # directory and is declared in source=().
              #
              # Therefore Kuzpkg makepkg can safely use
              # --cleanbuild.
              # ------------------------------------------------

              tar \
                --exclude=.git \
                --exclude=source-build \
                --exclude=kuzpkg-install \
                --exclude=package-build \
                --exclude=dist \
                -C /tmp/kuzpkg \
                -czf /tmp/kuzpkg-source.tar.gz \
                .

              cp \
                /tmp/kuzpkg-source.tar.gz \
                /tmp/package-build/kuzpkg-source.tar.gz

              # ------------------------------------------------
              # Kuzpkg PKGBUILD
              # ------------------------------------------------

              cat > /tmp/package-build/PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${ARCH_PKGVER}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=(x86_64)
              license=(GPL-2.0-or-later)
              depends=(
                bash
                libarchive
                curl
                gpgme
                openssl
                nettle
                libseccomp
              )
              makedepends=(
                meson
                ninja
                pkgconf
              )
              source=(
                kuzpkg-source.tar.gz
              )
              sha256sums=(
                SKIP
              )

              build() {
                  cd "\$srcdir"

                  test -f meson.build

                  meson setup \
                    build \
                    --buildtype=release \
                    --prefix=/usr

                  meson compile \
                    -C build
              }

              package() {
                  cd "\$srcdir"

                  meson install \
                    -C build \
                    --destdir "\$pkgdir" \
                    --no-rebuild \
                    --strip
              }
              EOF

              echo "Generated Kuzpkg PKGBUILD:"
              cat \
                /tmp/package-build/PKGBUILD

              # ------------------------------------------------
              # Builder user
              # ------------------------------------------------

              useradd \
                --create-home \
                builder

              chown \
                -R \
                builder:builder \
                /tmp/package-build \
                /tmp/kuzpkg-install

              # ------------------------------------------------
              # Use Kuzpkg's own makepkg
              # ------------------------------------------------

              su builder -c "
                cd /tmp/package-build

                export PATH=/tmp/kuzpkg-install/usr/bin:/usr/bin:/bin

                /usr/bin/bash \
                  /tmp/kuzpkg-install/usr/bin/makepkg \
                  --nodeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              # ------------------------------------------------
              # Locate package
              # ------------------------------------------------

              PKG_FILE="$(
                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Kuzpkg makepkg produced no package."

                find \
                  /tmp/package-build \
                  -maxdepth 2 \
                  -type f \
                  -print

                exit 1
              fi

              echo "Generated package:"
              ls -lh \
                "$PKG_FILE"

              # ------------------------------------------------
              # Rename native Arch package to Kuzpkg format
              # ------------------------------------------------

              BASE="$(
                basename \
                  "$PKG_FILE" \
                  ".pkg.tar.zst"
              )"

              OUTPUT="/export/${BASE}.kuzpkg.tar.zst"

              cp \
                "$PKG_FILE" \
                "$OUTPUT"

              test \
                -f \
                "$OUTPUT"

              tar \
                -tf \
                "$OUTPUT" \
                >/dev/null

              echo "Final Kuzpkg package:"
              ls -lh \
                "$OUTPUT"
            '

      - name: Verify Kuzpkg artifact
        run: |
          set -euxo pipefail

          PKG_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*.kuzpkg.tar.zst" |
            head -n 1
          )"

          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: No .kuzpkg.tar.zst artifact found."
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -print
            exit 1
          fi

          echo "Kuzpkg artifact:"
          ls -lh "$PKG_FILE"

      - name: Upload Kuzpkg package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # .KUZPKG.TAR.ZST O3
  # ============================================================

  kuzpkg-tar-zst-o3:
    name: ".kuzpkg.tar.zst O3 - Kuzpkg makepkg"
    runs-on: ubuntu-24.04

    steps:

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates

          docker --version

      - name: Build self-hosted Kuzpkg O3 package
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            -v "$PWD/dist:/export" \
            archlinux:latest \
            bash -euxo pipefail -c '

              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext

              rm -rf \
                /tmp/kuzpkg \
                /tmp/kuzpkg-install \
                /tmp/package-build \
                /tmp/kuzpkg-source.tar.gz

              mkdir -p \
                /tmp/package-build

              # ------------------------------------------------
              # Clone repository
              # ------------------------------------------------

              git clone \
                --filter=blob:none \
                https://github.com/Kuznix-Team/kuzpkg.git \
                /tmp/kuzpkg

              cd /tmp/kuzpkg

              git fetch \
                --tags \
                origin

              GIT_TAG="$(
                git tag \
                  --sort=-creatordate |
                head -n 1
              )"

              if [ -z "$GIT_TAG" ]; then
                GIT_TAG="$(
                  git describe \
                    --tags \
                    --abbrev=0 \
                    2>/dev/null || true
                )"
              fi

              if [ -z "$GIT_TAG" ]; then
                echo "ERROR: Repository has no Git tag."
                exit 1
              fi

              TAG_VERSION="${GIT_TAG#v}"
              DATE_VERSION="$(date -u +%Y%m%d)"

              ARCH_TAG_VERSION="$(
                printf "%s" "$TAG_VERSION" |
                  tr "-" "."
              )"

              ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

              echo "Git tag: ${GIT_TAG}"
              echo "Arch O3 pkgver: ${ARCH_PKGVER}"

              # ------------------------------------------------
              # Bootstrap Kuzpkg O3
              # ------------------------------------------------

              test \
                -f \
                /tmp/kuzpkg/meson.build

              meson setup \
                /tmp/kuzpkg/source-build \
                --buildtype=release \
                --prefix=/usr \
                -Denable-o3=true

              meson compile \
                -C /tmp/kuzpkg/source-build

              meson install \
                -C /tmp/kuzpkg/source-build \
                --destdir /tmp/kuzpkg-install \
                --no-rebuild \
                --strip

              MAKEPKG_PATH="/tmp/kuzpkg-install/usr/bin/makepkg"

              if [ ! -x "$MAKEPKG_PATH" ]; then
                echo "ERROR: Kuzpkg O3 makepkg was not installed."

                find \
                  /tmp/kuzpkg-install \
                  -maxdepth 5 \
                  \( -type f -o -type l \) \
                  -print

                exit 1
              fi

              echo "Bootstrapped Kuzpkg O3 makepkg:"
              "$MAKEPKG_PATH" --version || true

              # ------------------------------------------------
              # Create source archive
              # ------------------------------------------------

              tar \
                --exclude=.git \
                --exclude=source-build \
                --exclude=kuzpkg-install \
                --exclude=package-build \
                --exclude=dist \
                -C /tmp/kuzpkg \
                -czf /tmp/kuzpkg-source.tar.gz \
                .

              cp \
                /tmp/kuzpkg-source.tar.gz \
                /tmp/package-build/kuzpkg-source.tar.gz

              # ------------------------------------------------
              # O3 PKGBUILD
              # ------------------------------------------------

              cat > /tmp/package-build/PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${ARCH_PKGVER}
              pkgrel=1
              pkgdesc="kuzpkg package manager - O3 build"
              arch=(x86_64)
              license=(GPL-2.0-or-later)
              depends=(
                bash
                libarchive
                curl
                gpgme
                openssl
                nettle
                libseccomp
              )
              makedepends=(
                meson
                ninja
                pkgconf
              )
              source=(
                kuzpkg-source.tar.gz
              )
              sha256sums=(
                SKIP
              )

              build() {
                  cd "\$srcdir"

                  test -f meson.build

                  meson setup \
                    build \
                    --buildtype=release \
                    --prefix=/usr \
                    -Denable-o3=true

                  meson compile \
                    -C build
              }

              package() {
                  cd "\$srcdir"

                  meson install \
                    -C build \
                    --destdir "\$pkgdir" \
                    --no-rebuild \
                    --strip
              }
              EOF

              echo "Generated Kuzpkg O3 PKGBUILD:"
              cat \
                /tmp/package-build/PKGBUILD

              useradd \
                --create-home \
                builder

              chown \
                -R \
                builder:builder \
                /tmp/package-build \
                /tmp/kuzpkg-install

              # ------------------------------------------------
              # Build with Kuzpkg's own makepkg
              # ------------------------------------------------

              su builder -c "
                cd /tmp/package-build

                export PATH=/tmp/kuzpkg-install/usr/bin:/usr/bin:/bin

                /usr/bin/bash \
                  /tmp/kuzpkg-install/usr/bin/makepkg \
                  --nodeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              # ------------------------------------------------
              # Locate package
              # ------------------------------------------------

              PKG_FILE="$(
                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Kuzpkg O3 makepkg produced no package."

                find \
                  /tmp/package-build \
                  -maxdepth 2 \
                  -type f \
                  -print

                exit 1
              fi

              echo "Generated O3 package:"
              ls -lh \
                "$PKG_FILE"

              BASE="$(
                basename \
                  "$PKG_FILE" \
                  ".pkg.tar.zst"
              )"

              OUTPUT="/export/${BASE}-o3.kuzpkg.tar.zst"

              cp \
                "$PKG_FILE" \
                "$OUTPUT"

              test \
                -f \
                "$OUTPUT"

              tar \
                -tf \
                "$OUTPUT" \
                >/dev/null

              echo "Final Kuzpkg O3 package:"
              ls -lh \
                "$OUTPUT"
            '

      - name: Verify Kuzpkg O3 artifact
        run: |
          set -euxo pipefail

          PKG_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*-o3.kuzpkg.tar.zst" |
            head -n 1
          )"

          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: No Kuzpkg O3 artifact found."
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -print
            exit 1
          fi

          echo "Kuzpkg O3 artifact:"
          ls -lh "$PKG_FILE"

      - name: Upload Kuzpkg O3 package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst-o3
          path: dist/*-o3.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
