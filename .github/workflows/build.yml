name: Build kuzpkg packages

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  # ============================================================
  # .DEB
  # ============================================================

  deb:
    name: ".deb - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64

          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            dpkg-dev

          if [ "${{ matrix.mode }}" = "docker" ]; then
            command -v docker
            docker --version
          fi

      - name: Install native build dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            ca-certificates \
            git

      - name: Build native .deb
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          TAG="$(
            git describe --tags --abbrev=0 2>/dev/null || true
          )"

          [ -n "$TAG" ] || TAG="0.0.0"

          SAFE_TAG="$(
            printf '%s' "$TAG" |
              sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          DEB_VERSION="$(
            printf '%s' "$TAG" |
              sed 's/^v//; s/[^A-Za-z0-9.+~-]/./g'
          )"

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            deb-root/usr \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr

          meson compile -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a \
            staging/usr/. \
            deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc
            cp -a staging/etc/. deb-root/etc/
          fi

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${DEB_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb --info "$DEB_FILE"

          test -f "$DEB_FILE"

      - name: Build Debian Docker .deb
        if: matrix.mode == 'docker'
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                dpkg-dev

              TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$TAG" ] || TAG="0.0.0"

              SAFE_TAG="$(
                printf "%s" "$TAG" |
                  sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g"
              )"

              DEB_VERSION="$(
                printf "%s" "$TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9.+~-]/./g"
              )"

              rm -rf \
                build \
                staging \
                deb-root \
                dist

              mkdir -p \
                build \
                staging \
                deb-root/DEBIAN \
                deb-root/usr \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a \
                staging/usr/. \
                deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc
                cp -a staging/etc/. deb-root/etc/
              fi

              printf "%s\n" \
                "Package: kuzpkg" \
                "Version: ${DEB_VERSION}" \
                "Section: admin" \
                "Priority: optional" \
                "Architecture: ${TARGET_ARCH}" \
                "Maintainer: Kuznix Team" \
                "Description: kuzpkg package manager" \
                " Package manager for Kuznix Linux." \
                > deb-root/DEBIAN/control

              DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$DEB_FILE"

              dpkg-deb --info "$DEB_FILE"

              test -f "$DEB_FILE"
            '

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: "kuzpkg-deb-${{ matrix.name }}"
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


