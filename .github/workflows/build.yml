name: Build kuzpkg packages

# Once every day at 00:00 UTC. No push, PR, or manual trigger.
on:
  schedule:
    - cron: '0 0 * * *'
    - workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  deb:
    name: .deb - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VARIANT: normal
      O3_FLAG: ''
    strategy:
      fail-fast: false
      matrix: &debian_matrix
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64
          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64
          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64
          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64
          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64
          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64
          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64
          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64
          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64
          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64
          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64
    steps: &debian_steps
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates dpkg-dev
          command -v docker >/dev/null
          docker --version

      - name: Build native Ubuntu package
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential meson ninja-build pkg-config zstd \
            libarchive-dev libcurl4-openssl-dev libgpgme-dev libssl-dev \
            nettle-dev libseccomp-dev file gettext ca-certificates git

          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          [ -n "$tag" ] || tag='0.0.0'
          safe_tag="$(printf '%s' "$tag" | sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g')"
          deb_version="$(printf '%s' "$tag" | sed 's/^v//; s/[^A-Za-z0-9.+~-]/./g')"

          rm -rf build staging deb-root dist
          mkdir -p dist deb-root/DEBIAN deb-root/usr

          if [ -n "$O3_FLAG" ]; then
            meson setup build --buildtype=release --prefix=/usr "$O3_FLAG"
          else
            meson setup build --buildtype=release --prefix=/usr
          fi

          meson compile -C build
          meson install -C build --destdir "$PWD/staging" --no-rebuild --strip

          cp -a staging/usr/. deb-root/usr/
          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc
            cp -a staging/etc/. deb-root/etc/
          fi

          cat > deb-root/DEBIAN/control <<EOF
          Package: kuzpkg
          Version: ${deb_version}
          Section: admin
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Kuznix Team
          Description: kuzpkg package manager
           Package manager for Kuznix Linux (${PACKAGE_VARIANT} build).
          EOF

          suffix=''
          if [ "$PACKAGE_VARIANT" = 'o3' ]; then suffix='-o3'; fi
          deb_file="dist/kuzpkg-${safe_tag}-${{ matrix.name }}${suffix}.deb"
          dpkg-deb --build --root-owner-group deb-root "$deb_file"
          dpkg-deb --info "$deb_file"

      - name: Build Debian Docker package
        if: matrix.mode == 'docker'
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
        run: |
          set -euxo pipefail
          docker run --rm \
            -e PACKAGE_VARIANT \
            -e O3_FLAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y \
                build-essential meson ninja-build pkg-config zstd \
                libarchive-dev libcurl4-openssl-dev libgpgme-dev libssl-dev \
                nettle-dev libseccomp-dev file gettext ca-certificates git

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag="0.0.0"
              safe_tag="$(printf "%s" "$tag" | sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g")"
              deb_version="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9.+~-]/./g")"

              rm -rf build staging deb-root dist
              mkdir -p dist deb-root/DEBIAN deb-root/usr

              if [ -n "$O3_FLAG" ]; then
                meson setup build --buildtype=release --prefix=/usr "$O3_FLAG"
              else
                meson setup build --buildtype=release --prefix=/usr
              fi

              meson compile -C build
              meson install -C build --destdir "$PWD/staging" --no-rebuild --strip

              cp -a staging/usr/. deb-root/usr/
              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc
                cp -a staging/etc/. deb-root/etc/
              fi

              cat > deb-root/DEBIAN/control <<EOF
              Package: kuzpkg
              Version: ${deb_version}
              Section: admin
              Priority: optional
              Architecture: ${{ matrix.arch }}
              Maintainer: Kuznix Team
              Description: kuzpkg package manager
               Package manager for Kuznix Linux (${PACKAGE_VARIANT} build).
              EOF

              suffix=''
              if [ "$PACKAGE_VARIANT" = 'o3' ]; then suffix='-o3'; fi
              deb_file="dist/kuzpkg-${safe_tag}-${{ matrix.name }}${suffix}.deb"
              dpkg-deb --build --root-owner-group deb-root "$deb_file"
              dpkg-deb --info "$deb_file"
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}-${{ env.PACKAGE_VARIANT }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  deb-o3:
    name: .deb O3 - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VARIANT: o3
      O3_FLAG: -Denable-o3=true
    strategy:
      fail-fast: false
      matrix: *debian_matrix
    steps: *debian_steps

  rpm:
    name: .rpm - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VARIANT: normal
      O3_FLAG: ''
    strategy:
      fail-fast: false
      matrix: &fedora_matrix
        include:
          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide
    steps: &fedora_steps
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          command -v docker >/dev/null
          docker --version

      - name: Build RPM in Fedora container
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
        run: |
          set -euxo pipefail
          docker run --rm \
            -e PACKAGE_VARIANT \
            -e O3_FLAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '
              dnf -y update
              dnf -y install \
                git gcc gcc-c++ meson ninja-build pkgconf zstd \
                libarchive-devel libcurl-devel gpgme-devel openssl-devel \
                nettle-devel libseccomp-devel file gettext rpm-build rpmdevtools

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag="0.0.0"
              safe_tag="$(printf "%s" "$tag" | sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g")"
              rpm_version="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9._+]/./g")"

              rm -rf build staging rpm-build dist
              mkdir -p rpm-build/BUILD rpm-build/BUILDROOT rpm-build/RPMS rpm-build/SOURCES rpm-build/SPECS rpm-build/SRPMS dist

              if [ -n "$O3_FLAG" ]; then
                meson setup build --buildtype=release --prefix=/usr "$O3_FLAG"
              else
                meson setup build --buildtype=release --prefix=/usr
              fi

              meson compile -C build
              meson install -C build --destdir "$PWD/staging" --no-rebuild --strip

              cat > rpm-build/SPECS/kuzpkg.spec <<EOF
              Name: kuzpkg
              Version: ${rpm_version}
              Release: 1%{?dist}
              Summary: kuzpkg package manager
              License: GPLv2+

              %description
              Package manager for Kuznix Linux.

              %prep

              %build

              %install
              rm -rf %{buildroot}
              mkdir -p %{buildroot}
              cp -a /workspace/staging/. %{buildroot}/

              %files
              /usr/*
              %config(noreplace) /etc/kuzpkg.conf
              %config(noreplace) /etc/makepkg.conf
              %config(noreplace) /etc/makepkg.conf.d/fortran.conf
              %config(noreplace) /etc/makepkg.conf.d/rust.conf

              %changelog
              * $(date -u "+%a %b %d %Y") Kuznix Team - ${rpm_version}-1
              - Daily ${PACKAGE_VARIANT} Fedora build
              EOF

              rpmbuild --define "_topdir /workspace/rpm-build" -bb rpm-build/SPECS/kuzpkg.spec
              rpm_file="$(find rpm-build/RPMS -type f -name "*.rpm" | head -n1)"
              test -n "$rpm_file"
              suffix=''
              if [ "$PACKAGE_VARIANT" = 'o3' ]; then suffix='-o3'; fi
              cp "$rpm_file" "dist/kuzpkg-${safe_tag}-${{ matrix.name }}${suffix}.rpm"
              rpm -qip "$rpm_file"
            '

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}-${{ env.PACKAGE_VARIANT }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  rpm-o3:
    name: .rpm O3 - ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VARIANT: o3
      O3_FLAG: -Denable-o3=true
    strategy:
      fail-fast: false
      matrix: *fedora_matrix
    steps: *fedora_steps

  pkg-tar-zst:
    name: .pkg.tar.zst - Arch Linux
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VARIANT: normal
      O3_FLAG: ''
    steps: &arch_steps
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          command -v docker >/dev/null
          docker --version

      - name: Build Arch package
        run: |
          set -euxo pipefail
          docker run --rm \
            -e PACKAGE_VARIANT \
            -e O3_FLAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed \
                base-devel git meson ninja pkgconf zstd libarchive \
                curl gpgme openssl nettle libseccomp file gettext

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag='0.0.0'
              ver="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9._+]/./g")"

              rm -rf build dist
              mkdir -p dist

              meson_arg=''
              if [ "$PACKAGE_VARIANT" = 'o3' ]; then meson_arg='-Denable-o3=true'; fi

              cat > PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${ver}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=(x86_64)
              license=(GPL)
              depends=(bash libarchive curl gpgme openssl nettle libseccomp)

              build() {
                  meson setup build --buildtype=release --prefix=/usr ${meson_arg}
                  meson compile -C build
              }

              package() {
                  meson install -C build --destdir "\$pkgdir" --no-rebuild --strip
              }
              EOF

              useradd -m builder
              chown -R builder:builder /workspace
              su builder -c "cd /workspace && makepkg --syncdeps --noconfirm --cleanbuild --clean"
              chown -R root:root /workspace

              pkg="$(find /workspace -maxdepth 1 -type f -name 'kuzpkg-*.pkg.tar.zst' | head -n1)"
              test -n "$pkg"
              suffix=''
              if [ "$PACKAGE_VARIANT" = 'o3' ]; then suffix='-o3'; fi
              base="$(basename "$pkg" .pkg.tar.zst)"
              cp "$pkg" "dist/${base}${suffix}.pkg.tar.zst"
              tar -tf "dist/${base}${suffix}.pkg.tar.zst" >/dev/null
            '

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-pkg-tar-zst-${{ env.PACKAGE_VARIANT }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  pkg-tar-zst-o3:
    name: .pkg.tar.zst O3 - Arch Linux
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VARIANT: o3
      O3_FLAG: -Denable-o3=true
    steps: *arch_steps

  kuzpkg-tar-zst:
    name: .kuzpkg.tar.zst - Kuzpkg makepkg
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VARIANT: normal
      O3_FLAG: ''
    steps: &kuzpkg_steps
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          command -v docker >/dev/null
          docker --version

      - name: Build with Kuzpkg makepkg from source
        run: |
          set -euxo pipefail
          docker run --rm \
            -e PACKAGE_VARIANT \
            -e O3_FLAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed \
                base-devel git meson ninja pkgconf zstd libarchive \
                curl gpgme openssl nettle libseccomp file gettext

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag='0.0.0'
              ver="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9._+]/./g")"

              rm -rf source-build package-build /tmp/kuzpkg-install dist
              mkdir -p dist

              meson_arg=''
              if [ "$PACKAGE_VARIANT" = 'o3' ]; then meson_arg='-Denable-o3=true'; fi

              meson setup source-build \
                --buildtype=release \
                --prefix=/tmp/kuzpkg-install/usr \
                ${meson_arg}

              meson compile -C source-build
              meson install -C source-build --no-rebuild --strip

              test -x /tmp/kuzpkg-install/usr/bin/makepkg
              test -d /tmp/kuzpkg-install/usr/share/makepkg

              mkdir package-build
              cd package-build

              cat > PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${ver}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=(x86_64)
              license=(GPL)
              depends=(bash libarchive curl gpgme openssl nettle libseccomp)

              build() {
                  meson setup build --buildtype=release --prefix=/usr ${meson_arg}
                  meson compile -C build
              }

              package() {
                  meson install -C build --destdir "\$pkgdir" --no-rebuild --strip
              }
              EOF

              PATH=/tmp/kuzpkg-install/usr/bin:$PATH \
              /tmp/kuzpkg-install/usr/bin/makepkg \
                --syncdeps \
                --noconfirm \
                --cleanbuild \
                --clean

              pkg="$(find . -maxdepth 1 -type f -name 'kuzpkg-*.pkg.tar.zst' | head -n1)"
              test -n "$pkg"
              suffix=''
              if [ "$PACKAGE_VARIANT" = 'o3' ]; then suffix='-o3'; fi
              out="../dist/$(basename "$pkg" .pkg.tar.zst)${suffix}.kuzpkg.tar.zst"
              cp "$pkg" "$out"
              tar -tf "$out" >/dev/null
            '

      - name: Upload Kuzpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst-${{ env.PACKAGE_VARIANT }}
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  kuzpkg-tar-zst-o3:
    name: .kuzpkg.tar.zst O3 - Kuzpkg makepkg
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VARIANT: o3
      O3_FLAG: -Denable-o3=true
    steps: *kuzpkg_steps
