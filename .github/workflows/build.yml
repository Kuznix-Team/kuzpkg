name: Build kuzpkg daily snapshots

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==============================================================
  # LINUX BUILDS
  # ==============================================================

  build-linux:
    name: Build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            apk_arch: x86_64

          - runner: ubuntu-26.04-arm
            arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
            apk_arch: aarch64

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-gnutls-dev \
            gnupg-utils \
            gnupg2 \
            dpkg-dev \
            docker.io

      # ============================================================
      # VERSION / ARCH
      # ============================================================

      - name: Detect build information
        id: info
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi

          SAFE_TAG="$(
            printf '%s' "$LATEST_TAG" |
              sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          DEB_VERSION="$(
            printf '%s' "$LATEST_TAG" |
              sed 's/^v//; s/[^A-Za-z0-9.+~-]/./g'
          )"

          RPM_VERSION="$(
            printf '%s' "$LATEST_TAG" |
              sed 's/^v//; s/[^A-Za-z0-9._+]/./g'
          )"

          ARCH_PKGVER="$(
            printf '%s' "$LATEST_TAG" |
              sed 's/^v//; s/[^A-Za-z0-9._+]/./g'
          )"

          APK_PKGVER="$(
            printf '%s' "$LATEST_TAG" |
              sed 's/^v//; s/[^A-Za-z0-9._+-]/./g'
          )"

          DATE="$(date -u +%Y%m%d)"
          MACHINE="$(uname -m)"

          case "$MACHINE" in
            x86_64|amd64)
              ACTUAL_ARCH="x86_64"
              ;;
            aarch64|arm64)
              ACTUAL_ARCH="aarch64"
              ;;
            *)
              echo "Unsupported architecture: $MACHINE"
              exit 1
              ;;
          esac

          if [ "$ACTUAL_ARCH" != "${{ matrix.arch }}" ]; then
            echo "Architecture mismatch:"
            echo "  expected: ${{ matrix.arch }}"
            echo "  actual:   $ACTUAL_ARCH"
            exit 1
          fi

          mkdir -p dist

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "deb_version=$DEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "rpm_version=$RPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "arch_pkgver=$ARCH_PKGVER" >> "$GITHUB_OUTPUT"
          echo "apk_pkgver=$APK_PKGVER" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          echo "Latest tag: $LATEST_TAG"
          echo "Safe tag:   $SAFE_TAG"
          echo "Date:       $DATE"
          echo "Runner:     ${{ matrix.runner }}"
          echo "Arch:       ${{ matrix.arch }}"

      # ============================================================
      # MESON BUILD
      # ==============================================================

      - name: Configure Meson
        run: |
          set -euo pipefail

          meson setup build \
            --buildtype=release \
            --prefix=/usr

      - name: Build kuzpkg
        run: |
          set -euo pipefail

          meson compile -C build

      - name: Install kuzpkg into staging directory
        run: |
          set -euo pipefail

          rm -rf staging
          mkdir -p staging

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

      # ============================================================
      # DEBIAN PACKAGE
      # ============================================================

      - name: Build .deb package
        shell: bash
        run: |
          set -euo pipefail

          PKGROOT="$PWD/deb-root"

          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/DEBIAN" \
            "$PKGROOT/usr"

          cp -a staging/usr/. "$PKGROOT/usr/"

          if [ -d staging/etc ]; then
            mkdir -p "$PKGROOT/etc"
            cp -a staging/etc/. "$PKGROOT/etc/"
          fi

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: kuzpkg
          Version: ${{ steps.info.outputs.deb_version }}
          Section: admin
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Kuznix Team
          Description: kuzpkg package manager
           Package manager for Kuznix Linux.
          EOF

          DEB_FILE="dist/kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ steps.info.outputs.date }}-${{ matrix.runner }}-${{ matrix.arch }}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            "$PKGROOT" \
            "$DEB_FILE"

          dpkg-deb --info "$DEB_FILE"

      # ============================================================
      # FEDORA RAWIDE RPM
      # ============================================================

      - name: Build .rpm package with Fedora Rawhide
        shell: bash
        run: |
          set -euo pipefail

          rm -rf rpm-build

          mkdir -p \
            rpm-build/BUILD \
            rpm-build/BUILDROOT \
            rpm-build/RPMS \
            rpm-build/SOURCES \
            rpm-build/SPECS \
            rpm-build/SRPMS

          CHANGELOG_DATE="$(date -u '+%a %b %d %Y')"

          cat > rpm-build/SPECS/kuzpkg.spec <<EOF
          Name:           kuzpkg
          Version:        ${{ steps.info.outputs.rpm_version }}
          Release:        1%{?dist}
          Summary:        kuzpkg package manager
          License:        GPL-3.0-or-later
          BuildArch:      ${{ matrix.rpm_arch }}

          %description
          Package manager for Kuznix Linux.

          %prep

          %build

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}

          cp -a /workspace/staging/. %{buildroot}/

          %files
          /usr/*
          %config(noreplace) /etc/kuzpkg.conf
          %config(noreplace) /etc/makepkg.conf
          %config(noreplace) /etc/makepkg.conf.d/fortran.conf
          %config(noreplace) /etc/makepkg.conf.d/rust.conf

          %changelog
          * ${CHANGELOG_DATE} Kuznix Team - ${{ steps.info.outputs.rpm_version }}-1
          - Daily kuzpkg snapshot
          EOF

          docker run --rm \
            --platform "linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:rawhide \
            bash -euxo pipefail -c '
              dnf -y install rpm-build

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                /workspace/rpm-build/SPECS/kuzpkg.spec
            '

          RPM_FILE="$(find rpm-build/RPMS -type f -name '*.rpm' | head -n 1)"

          if [ -z "$RPM_FILE" ]; then
            echo "ERROR: RPM was not produced"
            find rpm-build/RPMS -type f -print
            exit 1
          fi

          cp \
            "$RPM_FILE" \
            "dist/kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ steps.info.outputs.date }}-${{ matrix.runner }}-${{ matrix.arch }}.rpm"

      # ============================================================
      # ARCH LINUX PACKAGE
      #
      # ONLY x86_64.
      # NO Arch build on aarch64.
      # ============================================================

      - name: Build .pkg.tar.zst and .kuzpkg.tar.zst with Arch Linux
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf arch-build
          mkdir -p arch-build

          cp -a staging arch-build/staging

          cat > arch-build/PKGBUILD <<EOF
          pkgname=kuzpkg
          pkgver=${{ steps.info.outputs.arch_pkgver }}
          pkgrel=1
          pkgdesc="kuzpkg package manager"
          arch=('x86_64')
          license=('GPL-3.0-or-later')
          options=('!strip')

          package() {
              cp -a /workspace/arch-build/staging/. "\$pkgdir/"
          }
          EOF

          docker pull archlinux:latest

          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace/arch-build \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Sy --noconfirm --needed \
                base-devel \
                zstd

              useradd -m builder

              chown -R builder:builder /workspace/arch-build

              su builder -c "makepkg --syncdeps --noconfirm --cleanbuild"

              chown -R root:root /workspace/arch-build
            '

          PKG_FILE="$(find arch-build -maxdepth 1 -type f -name 'kuzpkg-*.pkg.tar.zst' | head -n 1)"

          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: Arch package was not produced"
            find arch-build -maxdepth 1 -type f -print
            exit 1
          fi

          BASE_NAME="kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ steps.info.outputs.date }}-${{ matrix.runner }}-${{ matrix.arch }}"

          cp \
            "$PKG_FILE" \
            "dist/${BASE_NAME}.pkg.tar.zst"

          cp \
            "$PKG_FILE" \
            "dist/${BASE_NAME}.kuzpkg.tar.zst"

          cmp \
            "dist/${BASE_NAME}.pkg.tar.zst" \
            "dist/${BASE_NAME}.kuzpkg.tar.zst"

      # ============================================================
      # ALPINE EDGE APK
      #
      # Native Alpine Edge userspace/container.
      # abuild key is generated AS THE BUILD USER.
      # ============================================================

      - name: Build .apk package with Alpine Linux Edge
        shell: bash
        run: |
          set -euo pipefail

          rm -rf alpine-build
          mkdir -p alpine-build

          cp -a staging alpine-build/staging

          cat > alpine-build/APKBUILD <<EOF
          # Maintainer: Kuznix Team

          pkgname=kuzpkg
          pkgver=${{ steps.info.outputs.apk_pkgver }}
          pkgrel=0
          pkgdesc="kuzpkg package manager"
          url="https://github.com/KuznixTeam/kuzpkg"
          arch="${{ matrix.apk_arch }}"
          license="GPL-3.0-or-later"

          options="!check !strip"

          package() {
              cp -a /workspace/alpine-build/staging/. "\$pkgdir/"
          }
          EOF

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ALPINE_PLATFORM="linux/amd64"
          else
            ALPINE_PLATFORM="linux/arm64"
          fi

          echo "Alpine platform: $ALPINE_PLATFORM"
          echo "Alpine architecture: ${{ matrix.apk_arch }}"

          docker pull --platform "$ALPINE_PLATFORM" alpine:edge

          docker run --rm \
            --platform "$ALPINE_PLATFORM" \
            -v "$PWD:/workspace" \
            -w /workspace/alpine-build \
            alpine:edge \
            sh -euxc '
              apk update

              apk add --no-cache \
                alpine-sdk \
                abuild \
                fakeroot \
                sudo \
                zstd

              adduser -D builder

              addgroup builder abuild

              mkdir -p /home/builder/.abuild
              mkdir -p /home/builder/packages
              mkdir -p /var/cache/distfiles

              chown -R builder:builder \
                /workspace/alpine-build \
                /home/builder \
                /var/cache/distfiles

              # Generate the signing key AS builder.
              su builder -c "
                export HOME=/home/builder
                mkdir -p \"\$HOME/.abuild\"
                abuild-keygen -a -i -n
              "

              # Verify the key/config exists for builder.
              su builder -c "
                export HOME=/home/builder
                test -f \"\$HOME/.abuild/abuild.conf\"
                grep -E \"PACKAGER_PRIVKEY|PACKAGER\" \"\$HOME/.abuild/abuild.conf\" || true
                find \"\$HOME/.abuild\" -maxdepth 1 -type f -print
              "

              # Build as the same user that owns the signing key.
              su builder -c "
                export HOME=/home/builder
                cd /workspace/alpine-build
                abuild -r
              "

              # Copy generated APKs from builder's package repository
              # back into the mounted workspace.
              find /home/builder/packages \
                -type f \
                -name "*.apk" \
                -exec cp {} /workspace/alpine-build/ \;

              find /workspace/alpine-build \
                -maxdepth 1 \
                -type f \
                -name "*.apk" \
                -print
            '

          APK_FILE="$(find alpine-build -maxdepth 1 -type f -name 'kuzpkg-*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Alpine APK was not produced"

            echo "APK files found:"
            find alpine-build -type f -name '*.apk' -print || true

            exit 1
          fi

          BASE_NAME="kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ steps.info.outputs.date }}-${{ matrix.runner }}-${{ matrix.arch }}"

          cp \
            "$APK_FILE" \
            "dist/${BASE_NAME}.apk"

          echo "Alpine package:"
          ls -lh "dist/${BASE_NAME}.apk"

      # ============================================================
      # GENERIC .tar.zst INSTALL TREE
      # ============================================================

      - name: Create .tar.zst archive
        shell: bash
        run: |
          set -euo pipefail

          BASE_NAME="kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ steps.info.outputs.date }}-${{ matrix.runner }}-${{ matrix.arch }}"

          tar \
            --zstd \
            -cf "dist/${BASE_NAME}.tar.zst" \
            -C staging \
            .

          echo "Install-tree archive:"
          ls -lh "dist/${BASE_NAME}.tar.zst"

      # ============================================================
      # VALIDATION
      # ============================================================

      - name: Validate generated packages
        shell: bash
        run: |
          set -euo pipefail

          BASE_NAME="kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ steps.info.outputs.date }}-${{ matrix.runner }}-${{ matrix.arch }}"

          test -f "dist/${BASE_NAME}.tar.zst"
          test -f "dist/${BASE_NAME}.deb"
          test -f "dist/${BASE_NAME}.rpm"
          test -f "dist/${BASE_NAME}.apk"

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            test -f "dist/${BASE_NAME}.pkg.tar.zst"
            test -f "dist/${BASE_NAME}.kuzpkg.tar.zst"

            cmp \
              "dist/${BASE_NAME}.pkg.tar.zst" \
              "dist/${BASE_NAME}.kuzpkg.tar.zst"

            echo "Arch package aliases are identical."
          fi

          echo
          echo "============================================================"
          echo "Generated kuzpkg daily snapshot"
          echo "============================================================"

          ls -lh dist/

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload daily snapshot
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-${{ steps.info.outputs.safe_tag }}-${{ steps.info.outputs.date }}-${{ matrix.runner }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
