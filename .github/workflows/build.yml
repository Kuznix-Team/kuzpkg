          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          RPM_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              sed 's/-/~/g'
          ).${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "package_version=$PACKAGE_VERSION"
            echo "rpm_version=$RPM_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Build RPM O3
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e RPM_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '

              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                rpm-build \
                rpmdevtools

              rm -rf build staging rpm-build dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr \
                -Denable-o3=true

              meson compile -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              printf "%s\n" \
                "Name:           kuzpkg" \
                "Version:        ${RPM_VERSION}" \
                "Release:        1%{?dist}" \
                "Summary:        kuzpkg package manager" \
                "License:        GPLv2+" \
                "ExclusiveArch:  ${TARGET_ARCH}" \
                "" \
                "%description" \
                "Package manager for Kuznix Linux (O3 build)." \
                "" \
                "%prep" \
                "" \
                "%build" \
                "" \
                "%install" \
                "rm -rf %{buildroot}" \
                "mkdir -p %{buildroot}" \
                "cp -a /workspace/staging/. %{buildroot}/" \
                "" \
                "%files" \
                "/usr/*" \
                "" \
                "%changelog" \
                "* $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1" \
                "- Daily Fedora O3 build" \
                > rpm-build/SPECS/kuzpkg.spec

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              [ -n "$RPM_FILE" ] || {
                echo "ERROR: RPM O3 was not produced."
                exit 1
              }

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}-o3.rpm"

              cp "$RPM_FILE" "$OUTPUT"

              rpm -qip "$RPM_FILE"

              test -f "$OUTPUT"
            '

      - name: Upload RPM O3
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}-o3
          path: dist/*-o3.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # ARCH .PKG.TAR.ZST
  # ============================================================

  pkg-tar-zst:
    name: ".pkg.tar.zst - Arch Linux"
    runs-on: ubuntu-24.04

    steps:

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Build Arch package
        run: |
          set -euxo pipefail

          mkdir -p dist

          docker run \
            --rm \
            -v "$PWD/dist:/export" \
            archlinux:latest \
            bash -euxo pipefail -c '

              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext

              rm -rf \
                /tmp/kuzpkg \
                /tmp/package-build \
                /tmp/arch-pkg

              mkdir -p \
                /tmp/package-build \
                /tmp/arch-pkg

              # ------------------------------------------------
              # CLONE REPOSITORY ONLY IN ARCH DOCKER
              # ------------------------------------------------

              git clone \
                --filter=blob:none \
                https://github.com/Kuznix-Team/kuzpkg.git \
                /tmp/kuzpkg

              cd /tmp/kuzpkg

              git fetch \
                --tags \
                origin

              GIT_TAG="$(
                git tag \
                  --sort=-creatordate |
                head -n 1
              )"

              [ -n "$GIT_TAG" ] || {
                echo "ERROR: No Git tag in cloned repository."
                git tag --list
                exit 1
              }

              TAG_VERSION="${GIT_TAG#v}"
              DATE_VERSION="$(date -u +%Y%m%d)"

              ARCH_TAG_VERSION="$(
                printf "%s" "$TAG_VERSION" |
                  tr "-" "."
              )"

              ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

              echo "Repository: https://github.com/Kuznix-Team/kuzpkg.git"
              echo "Git tag: ${GIT_TAG}"
              echo "Arch pkgver: ${ARCH_PKGVER}"

              # ------------------------------------------------
              # Use the already-cloned source directly.
              #
              # No recursive copy.
              # No archive being written into source tree.
              # ------------------------------------------------

              cp \
                -a \
                /tmp/kuzpkg \
                /tmp/package-build/source

              rm -rf \
                /tmp/package-build/source/.git

              cat \
                > /tmp/package-build/PKGBUILD \
                <<EOF
pkgname=kuzpkg
pkgver=${ARCH_PKGVER}
pkgrel=1
pkgdesc='kuzpkg package manager'
arch=(x86_64)
license=(GPL)
depends=(bash libarchive curl gpgme openssl nettle libseccomp)

build() {
    cd "\$srcdir/source"
    meson setup build --buildtype=release --prefix=/usr
    meson compile -C build
}

package() {
    cd "\$srcdir/source"
    meson install -C build --destdir "\$pkgdir" --no-rebuild --strip
}
EOF

              # ------------------------------------------------
              # Build with SYSTEM makepkg.
              # This Arch job is the standard .pkg.tar.zst job.
              # ------------------------------------------------

              useradd \
                -m \
                builder

              chown \
                -R \
                builder:builder \
                /tmp/package-build

              su builder -c "
                cd /tmp/package-build

                /usr/bin/makepkg \
                  --nodeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              PKG_FILE="$(
                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              [ -n "$PKG_FILE" ] || {
                echo "ERROR: Arch package was not produced."
                find /tmp/package-build -maxdepth 1 -type f -print
                exit 1
              }

              cp \
                "$PKG_FILE" \
                "/export/$(basename "$PKG_FILE")"

              tar \
                -tf \
                "/export/$(basename "$PKG_FILE")" \
                >/dev/null

              ls -lh /export
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-pkg-tar-zst
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


