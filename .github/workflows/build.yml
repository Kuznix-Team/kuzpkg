name: Build kuzpkg packages

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  # ============================================================
  # DEB
  # ============================================================

  deb:
    name: ".deb - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64

          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            git tag --list
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"
          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          echo "Git tag: $GIT_TAG"
          echo "Package version: $PACKAGE_VERSION"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            dpkg-dev

          if [ "${{ matrix.mode }}" = "docker" ]; then
            docker --version
          fi

      - name: Install native dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            ca-certificates \
            git

      - name: Build native .deb
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            deb-root/usr \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr

          meson compile \
            -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a \
            staging/usr/. \
            deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc

            cp -a \
              staging/etc/. \
              deb-root/etc/
          fi

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${PACKAGE_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb \
            --info \
            "$DEB_FILE"

          test \
            -f \
            "$DEB_FILE"

      - name: Build Debian Docker .deb
        if: matrix.mode == 'docker'
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                dpkg-dev

              rm -rf \
                build \
                staging \
                deb-root \
                dist

              mkdir -p \
                build \
                staging \
                deb-root/DEBIAN \
                deb-root/usr \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a \
                staging/usr/. \
                deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc

                cp -a \
                  staging/etc/. \
                  deb-root/etc/
              fi

              printf "%s\n" \
                "Package: kuzpkg" \
                "Version: ${PACKAGE_VERSION}" \
                "Section: admin" \
                "Priority: optional" \
                "Architecture: ${TARGET_ARCH}" \
                "Maintainer: Kuznix Team" \
                "Description: kuzpkg package manager" \
                " Package manager for Kuznix Linux." \
                > deb-root/DEBIAN/control

              DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$DEB_FILE"

              dpkg-deb \
                --info \
                "$DEB_FILE"

              test \
                -f \
                "$DEB_FILE"
            '

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # DEB O3
  # ============================================================

  deb-o3:
    name: ".deb O3 - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: ubuntu-24.04
            runner: ubuntu-24.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          - name: debian-12
            runner: ubuntu-24.04
            mode: docker
            image: debian:12
            arch: amd64

          - name: debian-12-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:12
            arch: arm64

          - name: debian-13
            runner: ubuntu-24.04
            mode: docker
            image: debian:13
            arch: amd64

          - name: debian-13-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:13
            arch: arm64

          - name: debian-testing
            runner: ubuntu-24.04
            mode: docker
            image: debian:testing
            arch: amd64

          - name: debian-testing-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:testing
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-24.04
            mode: docker
            image: debian:unstable
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            arch: arm64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"
          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            dpkg-dev

          if [ "${{ matrix.mode }}" = "docker" ]; then
            docker --version
          fi

      - name: Install native O3 dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            ca-certificates \
            git

      - name: Build native .deb O3
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            deb-root/usr \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr \
            -Denable-o3=true

          meson compile \
            -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a \
            staging/usr/. \
            deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc

            cp -a \
              staging/etc/. \
              deb-root/etc/
          fi

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${PACKAGE_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux (O3 build)." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}-o3.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb \
            --info \
            "$DEB_FILE"

      - name: Build Debian Docker .deb O3
        if: matrix.mode == 'docker'
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                dpkg-dev

              rm -rf \
                build \
                staging \
                deb-root \
                dist

