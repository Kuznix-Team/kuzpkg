  # ============================================================
  # KUZPKG .KUZPKG.TAR.ZST
  #
  # This is the special self-hosting job:
  #
  # 1. Clone Kuzpkg
  # 2. Build Kuzpkg
  # 3. Take makepkg from that build
  # 4. Use that makepkg to package Kuzpkg
  #
  # The source directory is used directly through --noextract.
  # No source archive is required.
  # ============================================================

  kuzpkg-tar-zst:
    name: ".kuzpkg.tar.zst - Kuzpkg makepkg"
    runs-on: ubuntu-24.04

    steps:

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Self-host Kuzpkg package
        run: |
          set -euxo pipefail

          mkdir -p dist

          docker run \
            --rm \
            -v "$PWD/dist:/export" \
            archlinux:latest \
            bash -euxo pipefail -c '

              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext

              rm -rf \
                /tmp/kuzpkg \
                /tmp/kuzpkg-install \
                /tmp/package-build

              # ------------------------------------------------
              # Clone source.
              # ------------------------------------------------

              git clone \
                --filter=blob:none \
                https://github.com/Kuznix-Team/kuzpkg.git \
                /tmp/kuzpkg

              cd /tmp/kuzpkg

              git fetch \
                --tags \
                origin

              GIT_TAG="$(
                git tag \
                  --sort=-creatordate |
                head -n 1
              )"

              [ -n "$GIT_TAG" ] || {
                echo "ERROR: No Git tag."
                git tag --list
                exit 1
              }

              TAG_VERSION="${GIT_TAG#v}"
              DATE_VERSION="$(date -u +%Y%m%d)"

              ARCH_TAG_VERSION="$(
                printf "%s" "$TAG_VERSION" |
                  tr "-" "."
              )"

              ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

              echo "Repository: https://github.com/Kuznix-Team/kuzpkg.git"
              echo "Latest Git tag: ${GIT_TAG}"
              echo "Arch pkgver: ${ARCH_PKGVER}"

              # ------------------------------------------------
              # Build Kuzpkg itself.
              # ------------------------------------------------

              meson setup \
                source-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C source-build

              meson install \
                -C source-build \
                --destdir /tmp/kuzpkg-install \
                --no-rebuild \
                --strip

              MAKEPKG_PATH="/tmp/kuzpkg-install/usr/bin/makepkg"

              if [ ! -x "$MAKEPKG_PATH" ]; then
                echo "ERROR: Kuzpkg makepkg was not installed."

                find \
                  /tmp/kuzpkg-install \
                  -type f \
                  -o -type l

                exit 1
              fi

              echo "Kuzpkg makepkg:"
              "$MAKEPKG_PATH" --version || true

              # ------------------------------------------------
              # Make a package source workspace.
              # No archive.
              # ------------------------------------------------

              mkdir -p \
                /tmp/package-build/source

              cp -a \
                /tmp/kuzpkg/. \
                /tmp/package-build/source/

              rm -rf \
                /tmp/package-build/source/.git

              # ------------------------------------------------
              # PKGBUILD uses the prepared source tree.
              # No source extraction.
              # ------------------------------------------------

              cat \
                > /tmp/package-build/PKGBUILD \
                <<EOF
pkgname=kuzpkg
pkgver=${ARCH_PKGVER}
pkgrel=1
pkgdesc='kuzpkg package manager'
arch=(x86_64)
license=(GPL)
depends=(bash libarchive curl gpgme openssl nettle libseccomp)

build() {
    cd "\$srcdir/source"

    meson setup build --buildtype=release --prefix=/usr
    meson compile -C build
}

package() {
    cd "\$srcdir/source"

    meson install \
        -C build \
        --destdir "\$pkgdir" \
        --no-rebuild \
        --strip
}
EOF

              # ------------------------------------------------
              # Create a builder account.
              # ------------------------------------------------

              useradd \
                -m \
                builder

              chown \
                -R \
                builder:builder \
                /tmp/package-build \
                /tmp/kuzpkg-install

              # ------------------------------------------------
              # IMPORTANT:
              #
              # --noextract prevents makepkg from deleting or
              # replacing the prepared source directory.
              #
              # --nodeps prevents the self-built makepkg from
              # requiring its PACMAN dependency-operation helper.
              #
              # Explicit /usr/bin/bash is used so the script is
              # executed by the system Bash in the container.
              # ------------------------------------------------

              su builder -c "
                cd /tmp/package-build

                PATH=/tmp/kuzpkg-install/usr/bin:/usr/bin:/bin

                /usr/bin/bash \
                  /tmp/kuzpkg-install/usr/bin/makepkg \
                  --nodeps \
                  --noextract \
                  --noconfirm \
                  --clean
              "

              PKG_FILE="$(
                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Kuzpkg makepkg produced no package."

                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -print

                exit 1
              fi

              BASE="$(
                basename \
                  "$PKG_FILE" \
                  ".pkg.tar.zst"
              )"

              OUTPUT="/export/${BASE}.kuzpkg.tar.zst"

              cp \
                "$PKG_FILE" \
                "$OUTPUT"

              tar \
                -tf \
                "$OUTPUT" \
                >/dev/null

              test \
                -f \
                "$OUTPUT"

              echo "Created:"
              ls -lh "$OUTPUT"
            '

      - name: Upload Kuzpkg package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


