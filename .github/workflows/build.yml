  # ============================================================
  # .KUZPKG.TAR.ZST
  # Build using makepkg from the kuzpkg source tree
  # inside Arch Linux Docker
  # ============================================================

  kuzpkg-tar-zst:
    name: .kuzpkg.tar.zst - Arch + Kuzpkg makepkg
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Docker
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Build Kuzpkg and package with Kuzpkg makepkg
        run: |
          set -euxo pipefail

          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext \
                asciidoc \
                git

              # --------------------------------------------------
              # First build kuzpkg from its own source.
              # This gives us the makepkg implementation from
              # this source tree.
              # --------------------------------------------------

              meson setup source-build \
                --buildtype=release \
                --prefix=/usr

              meson compile -C source-build

              rm -rf source-staging

              meson install \
                -C source-build \
                --destdir "$PWD/source-staging" \
                --no-rebuild \
                --strip

              # Put kuzpkg tools from this source build on PATH.
              export PATH="$PWD/source-staging/usr/bin:$PATH"
              export MAKEPKG="$PWD/source-staging/usr/bin/makepkg"

              test -x "$MAKEPKG"

              "$MAKEPKG" --version || true

              # --------------------------------------------------
              # Create the Kuzpkg package definition.
              # --------------------------------------------------

              LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$LATEST_TAG" ] || LATEST_TAG="0.0.0"

              PKGVER="$(
                printf "%s" "$LATEST_TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              cat > PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${PKGVER}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=("x86_64")
              license=("GPL")
              depends=(
                "bash"
                "libarchive"
                "curl"
                "gpgme"
                "openssl"
                "nettle"
                "libseccomp"
              )

              build() {
                  meson setup build \
                    --buildtype=release \
                    --prefix=/usr
                  meson compile -C build
              }

              package() {
                  meson install \
                    -C build \
                    --destdir "$pkgdir" \
                    --no-rebuild \
                    --strip
              }
              EOF

              useradd -m builder
              chown -R builder:builder /workspace

              # --------------------------------------------------
              # Use the makepkg built from the Kuzpkg sources.
              # --------------------------------------------------

              su builder -c "
                cd /workspace
                PATH=/workspace/source-staging/usr/bin:\$PATH \
                /workspace/source-staging/usr/bin/makepkg \
                  --syncdeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              chown -R root:root /workspace

              mkdir -p dist

              PKG_FILE="$(find /workspace -maxdepth 1 -type f -name "kuzpkg-*.pkg.tar.zst" | head -n 1)"

              test -n "$PKG_FILE"

              cp "$PKG_FILE" \
                "dist/$(basename "$PKG_FILE" .pkg.tar.zst).kuzpkg.tar.zst"
            '

      - name: Validate Kuzpkg package
        run: |
          set -euxo pipefail

          test -f dist/*.kuzpkg.tar.zst

          docker run --rm \
            -v "$PWD/dist:/dist" \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm zstd

              PKG="$(find /dist -type f -name "*.kuzpkg.tar.zst" | head -n 1)"

              test -n "$PKG"

              tar -tf "$PKG" >/dev/null
            '

      - name: Upload Kuzpkg package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


