name: Build kuzpkg packages

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:

  # ==========================================================
  # .DEB
  #
  # Native:
  #   Ubuntu 26.04 x86_64
  #   Ubuntu 26.04 ARM64
  #   Debian unstable x86_64
  #   Debian unstable ARM64
  #
  # Generic:
  #   x86_64
  #   ARM64
  #   PPC64LE
  #   RISC-V64
  #   ARMv7
  #   S390X
  # ==========================================================

  deb:
    name: ".deb - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            image: ""
            platform: linux/amd64
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            image: ""
            platform: linux/arm64
            arch: arm64

          - name: debian-unstable
            runner: ubuntu-26.04
            mode: docker
            image: debian:unstable
            platform: linux/amd64
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            platform: linux/arm64
            arch: arm64

          - name: generic-amd64
            runner: ubuntu-26.04
            mode: docker
            image: ubuntu:26.04
            platform: linux/amd64
            arch: amd64

          - name: generic-arm64
            runner: ubuntu-26.04
            mode: docker
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: arm64

          - name: generic-ppc64le
            runner: ubuntu-26.04
            mode: docker
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64el

          - name: generic-riscv64
            runner: ubuntu-26.04
            mode: docker
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-armv7
            runner: ubuntu-26.04
            mode: docker
            image: arm32v7/ubuntu:26.04
            platform: linux/arm/v7
            arch: armhf

          - name: generic-s390x
            runner: ubuntu-26.04
            mode: docker
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            git tag --list
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"
          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.mode == 'docker'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Install native dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            git \
            dpkg-dev

      - name: Prepare Docker runner
        if: matrix.mode == 'docker'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates

          docker --version

      - name: Verify Docker architecture
        if: matrix.mode == 'docker'
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            --platform "$PLATFORM" \
            "$IMAGE" \
            uname -m

      - name: Build native .deb
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr

          meson compile \
            -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a \
            staging/. \
            deb-root/

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${PACKAGE_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb --info "$DEB_FILE"
          dpkg-deb --contents "$DEB_FILE"

          test -f "$DEB_FILE"

      - name: Build Docker .deb
        if: matrix.mode == 'docker'
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                dpkg-dev

              rm -rf \
                build \
                staging \
                deb-root \
                dist

              mkdir -p \
                build \
                staging \
                deb-root/DEBIAN \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a \
                staging/. \
                deb-root/

              printf "%s\n" \
                "Package: kuzpkg" \
                "Version: ${PACKAGE_VERSION}" \
                "Section: admin" \
                "Priority: optional" \
                "Architecture: ${TARGET_ARCH}" \
                "Maintainer: Kuznix Team" \
                "Description: kuzpkg package manager" \
                " Package manager for Kuznix Linux." \
                > deb-root/DEBIAN/control

              DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$DEB_FILE"

              dpkg-deb --info "$DEB_FILE"
              dpkg-deb --contents "$DEB_FILE"

              test -f "$DEB_FILE"
            '

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ==========================================================
  # .RPM
  #
  # ARMv7 intentionally NOT supported here.
  # ==========================================================

  rpm:
    name: ".rpm - ${{ matrix.name }}"
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: generic-amd64
            image: ubuntu:26.04
            platform: linux/amd64
            rpm_arch: x86_64

          - name: generic-arm64
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            rpm_arch: aarch64

          - name: generic-ppc64le
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            rpm_arch: ppc64le

          - name: generic-riscv64
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            rpm_arch: riscv64

          - name: generic-s390x
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            rpm_arch: s390x

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"
          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          RPM_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              sed \
                's/-/~/g; s/+/_/g'
          ).${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "package_version=$PACKAGE_VERSION"
            echo "rpm_version=$RPM_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Verify Docker architecture
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            --platform "$PLATFORM" \
            "$IMAGE" \
            uname -m

      - name: Build RPM
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.rpm_arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e RPM_VERSION \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                rpm

              rm -rf \
                build \
                staging \
                rpm-build \
                dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              printf "%s\n" \
                "Name:           kuzpkg" \
                "Version:        ${RPM_VERSION}" \
                "Release:        1" \
                "Summary:        kuzpkg package manager" \
                "License:        GPL-2.0-or-later" \
                "BuildArch:      ${TARGET_ARCH}" \
                "" \
                "%description" \
                "Package manager for Kuznix Linux." \
                "" \
                "%prep" \
                "" \
                "%build" \
                "" \
                "%install" \
                "rm -rf %{buildroot}" \
                "mkdir -p %{buildroot}" \
                "cp -a /workspace/staging/. %{buildroot}/" \
                "" \
                "%files" \
                "/usr/*" \
                "/etc/kuzpkg.conf" \
                "/etc/makepkg.conf" \
                "/etc/makepkg.conf.d/*" \
                "" \
                "%changelog" \
                "* $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1" \
                "- Generic Ubuntu 26.04 build" \
                > rpm-build/SPECS/kuzpkg.spec

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find \
                  rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: RPM was not produced."
                exit 1
              fi

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.rpm"

              cp "$RPM_FILE" "$OUTPUT"

              rpm -qip "$RPM_FILE"
              rpm -qlp "$RPM_FILE"

              test -f "$OUTPUT"
            '

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ==========================================================
  # .PKG.TAR.ZST
  #
  # ARMv7 intentionally NOT supported here.
  #
  # Direct package creation.
  # ==========================================================

  pkg-tar-zst:
    name: ".pkg.tar.zst - ${{ matrix.name }}"
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: generic-amd64
            image: ubuntu:26.04
            platform: linux/amd64
            arch: x86_64

          - name: generic-arm64
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: aarch64

          - name: generic-ppc64le
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64le

          - name: generic-riscv64
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-s390x
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          ARCH_TAG_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              tr '-' '.'
          )"

          ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "pkgver=$ARCH_PKGVER"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Verify Docker architecture
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            --platform "$PLATFORM" \
            "$IMAGE" \
            uname -m

      - name: Build .pkg.tar.zst
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PKGVER: ${{ steps.version.outputs.pkgver }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PKGVER \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                tar

              rm -rf \
                /tmp/kuzpkg-build \
                /tmp/pkg-root

              mkdir -p /tmp/pkg-root

              meson setup \
                /tmp/kuzpkg-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C /tmp/kuzpkg-build

              meson install \
                -C /tmp/kuzpkg-build \
                --destdir /tmp/pkg-root \
                --no-rebuild \
                --strip

              test \
                -x \
                /tmp/pkg-root/usr/bin/kuzpkg

              BUILD_DATE="$(date -u +%s)"

              PACKAGE_SIZE="$(
                du -sb /tmp/pkg-root |
                awk "{print \$1}"
              )"

              printf "%s\n" \
                "pkgname = kuzpkg" \
                "pkgbase = kuzpkg" \
                "pkgver = ${PKGVER}" \
                "pkgrel = 1" \
                "pkgdesc = kuzpkg package manager" \
                "arch = ${TARGET_ARCH}" \
                "license = GPL-2.0-or-later" \
                "packager = Kuznix Team" \
                "url = https://github.com/Kuznix-Team/kuzpkg" \
                "builddate = ${BUILD_DATE}" \
                "size = ${PACKAGE_SIZE}" \
                > /tmp/pkg-root/.PKGINFO

              printf "%s\n" \
                "builddate = ${BUILD_DATE}" \
                "builddir = /workspace" \
                "buildenv = kuzpkg-ci" \
                "format = pkg.tar.zst" \
                > /tmp/pkg-root/.BUILDINFO

              find \
                /tmp/pkg-root \
                -mindepth 1 \
                -maxdepth 6 \
                -print |
              sort \
                > /tmp/pkg-root/.FILELIST

              OUTPUT="/workspace/dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PKGVER}.pkg.tar.zst"

              tar \
                --sort=name \
                --owner=0 \
                --group=0 \
                --numeric-owner \
                --mtime="@0" \
                -C /tmp/pkg-root \
                -cf - \
                . |
              zstd \
                -T0 \
                -19 \
                -o "$OUTPUT"

              zstd -t "$OUTPUT"

              zstd -dc "$OUTPUT" |
              tar -tf - \
                > /tmp/package-files.txt

              grep -Fx "./.PKGINFO" /tmp/package-files.txt
              grep -Fx "./.BUILDINFO" /tmp/package-files.txt
              grep -Fx "./usr/bin/kuzpkg" /tmp/package-files.txt

              echo "Created:"
              ls -lh "$OUTPUT"
            '

      - name: Verify .pkg.tar.zst
        run: |
          set -euxo pipefail

          PKG_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*.pkg.tar.zst" |
            head -n 1
          )"

          test -n "$PKG_FILE"

          ls -lh "$PKG_FILE"

      - name: Upload .pkg.tar.zst
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-pkg-tar-zst-${{ matrix.name }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ==========================================================
  # .KUZPKG.TAR.ZST
  #
  # ARMv7 intentionally NOT supported here.
  #
  # Direct package creation.
  # ==========================================================

  kuzpkg-tar-zst:
    name: ".kuzpkg.tar.zst - ${{ matrix.name }}"
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: generic-amd64
            image: ubuntu:26.04
            platform: linux/amd64
            arch: x86_64

          - name: generic-arm64
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: aarch64

          - name: generic-ppc64le
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64le

          - name: generic-riscv64
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-s390x
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          ARCH_TAG_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              tr '-' '.'
          )"

          ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "pkgver=$ARCH_PKGVER"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Verify Docker architecture
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            --platform "$PLATFORM" \
            "$IMAGE" \
            uname -m

      - name: Build .kuzpkg.tar.zst
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PKGVER: ${{ steps.version.outputs.pkgver }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PKGVER \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                tar

              rm -rf \
                /tmp/kuzpkg-build \
                /tmp/pkg-root

              mkdir -p /tmp/pkg-root

              meson setup \
                /tmp/kuzpkg-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C /tmp/kuzpkg-build

              meson install \
                -C /tmp/kuzpkg-build \
                --destdir /tmp/pkg-root \
                --no-rebuild \
                --strip

              test \
                -x \
                /tmp/pkg-root/usr/bin/kuzpkg

              BUILD_DATE="$(date -u +%s)"

              PACKAGE_SIZE="$(
                du -sb /tmp/pkg-root |
                awk "{print \$1}"
              )"

              printf "%s\n" \
                "pkgname = kuzpkg" \
                "pkgbase = kuzpkg" \
                "pkgver = ${PKGVER}" \
                "pkgrel = 1" \
                "pkgdesc = kuzpkg package manager" \
                "arch = ${TARGET_ARCH}" \
                "license = GPL-2.0-or-later" \
                "packager = Kuznix Team" \
                "url = https://github.com/Kuznix-Team/kuzpkg" \
                "builddate = ${BUILD_DATE}" \
                "size = ${PACKAGE_SIZE}" \
                > /tmp/pkg-root/.PKGINFO

              printf "%s\n" \
                "builddate = ${BUILD_DATE}" \
                "builddir = /workspace" \
                "buildenv = kuzpkg-ci" \
                "format = kuzpkg-tar-zst" \
                > /tmp/pkg-root/.BUILDINFO

              find \
                /tmp/pkg-root \
                -mindepth 1 \
                -maxdepth 6 \
                -print |
              sort \
                > /tmp/pkg-root/.FILELIST

              OUTPUT="/workspace/dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PKGVER}.kuzpkg.tar.zst"

              tar \
                --sort=name \
                --owner=0 \
                --group=0 \
                --numeric-owner \
                --mtime="@0" \
                -C /tmp/pkg-root \
                -cf - \
                . |
              zstd \
                -T0 \
                -19 \
                -o "$OUTPUT"

              zstd -t "$OUTPUT"

              zstd -dc "$OUTPUT" |
              tar -tf - \
                > /tmp/kuzpkg-files.txt

              grep -Fx "./.PKGINFO" /tmp/kuzpkg-files.txt
              grep -Fx "./.BUILDINFO" /tmp/kuzpkg-files.txt
              grep -Fx "./usr/bin/kuzpkg" /tmp/kuzpkg-files.txt

              echo "Created:"
              ls -lh "$OUTPUT"
            '

      - name: Verify .kuzpkg.tar.zst
        run: |
          set -euxo pipefail

          PKG_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*.kuzpkg.tar.zst" |
            head -n 1
          )"

          test -n "$PKG_FILE"

          ls -lh "$PKG_FILE"

      - name: Upload .kuzpkg.tar.zst
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst-${{ matrix.name }}
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ==========================================================
  # GENERIC .TAR.ZST
  #
  # ALL ARCHITECTURES:
  #   x86_64
  #   ARM64
  #   PPC64LE
  #   RISC-V64
  #   ARMv7
  #   S390X
  #
  # This is NOT a package-manager package.
  #
  # It is simply the installed Kuzpkg filesystem compressed
  # as a deterministic tar.zst archive.
  # ==========================================================

  tar-zst:
    name: ".tar.zst - ${{ matrix.name }}"
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: generic-amd64
            image: ubuntu:26.04
            platform: linux/amd64
            arch: x86_64

          - name: generic-arm64
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: aarch64

          - name: generic-ppc64le
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64le

          - name: generic-riscv64
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-armv7
            image: arm32v7/ubuntu:26.04
            platform: linux/arm/v7
            arch: armv7

          - name: generic-s390x
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            git tag --list
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"
          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Verify Docker architecture
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            --platform "$PLATFORM" \
            "$IMAGE" \
            uname -m

      - name: Build .tar.zst
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                tar

              rm -rf \
                /tmp/kuzpkg-build \
                /tmp/tar-root

              mkdir -p \
                /tmp/tar-root

              # ------------------------------------------------
              # Build kuzpkg.
              # ------------------------------------------------

              meson setup \
                /tmp/kuzpkg-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C /tmp/kuzpkg-build

              # ------------------------------------------------
              # Install kuzpkg into archive root.
              # ------------------------------------------------

              meson install \
                -C /tmp/kuzpkg-build \
                --destdir /tmp/tar-root \
                --no-rebuild \
                --strip

              test \
                -x \
                /tmp/tar-root/usr/bin/kuzpkg

              # ------------------------------------------------
              # Deterministic tar.zst.
              #
              # No .PKGINFO.
              # No .BUILDINFO.
              # No package-manager metadata.
              # ------------------------------------------------

              OUTPUT="/workspace/dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.tar.zst"

              tar \
                --sort=name \
                --owner=0 \
                --group=0 \
                --numeric-owner \
                --mtime="@0" \
                -C /tmp/tar-root \
                -cf - \
                . |
              zstd \
                -T0 \
                -19 \
                -o "$OUTPUT"

              # ------------------------------------------------
              # Verify archive.
              # ------------------------------------------------

              zstd \
                -t \
                "$OUTPUT"

              zstd \
                -dc \
                "$OUTPUT" |
              tar \
                -tf - \
                > /tmp/tar-files.txt

              grep \
                -Fx \
                "./usr/bin/kuzpkg" \
                /tmp/tar-files.txt

              echo "Created:"
              ls -lh "$OUTPUT"
            '

      - name: Verify .tar.zst
        run: |
          set -euxo pipefail

          TAR_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*.tar.zst" \
              ! -name "*.pkg.tar.zst" \
              ! -name "*.kuzpkg.tar.zst" |
            head -n 1
          )"

          if [ -z "$TAR_FILE" ]; then
            echo "ERROR: No .tar.zst artifact."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

          ls -lh "$TAR_FILE"

      - name: Upload .tar.zst
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-tar-zst-${{ matrix.name }}
          path: dist/*.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
