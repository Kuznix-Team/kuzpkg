          compression-level: 0
          retention-days: 30


  # ============================================================
  # .RPM
  # ============================================================

  rpm:
    name: ".rpm - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
            arch: x86_64

          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
            arch: aarch64

          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
            arch: x86_64

          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
            arch: aarch64

          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
            arch: x86_64

          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide
            arch: aarch64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          command -v docker
          docker --version

      - name: Build RPM
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '

              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                rpm-build \
                rpmdevtools

              TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$TAG" ] || TAG="0.0.0"

              SAFE_TAG="$(
                printf "%s" "$TAG" |
                  sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g"
              )"

              RPM_VERSION="$(
                printf "%s" "$TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              rm -rf \
                build \
                staging \
                rpm-build \
                dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              printf "%s\n" \
                "Name:           kuzpkg" \
                "Version:        ${RPM_VERSION}" \
                "Release:        1%{?dist}" \
                "Summary:        kuzpkg package manager" \
                "License:        GPLv2+" \
                "ExclusiveArch:  ${TARGET_ARCH}" \
                "" \
                "%description" \
                "Package manager for Kuznix Linux." \
                "" \
                "%prep" \
                "" \
                "%build" \
                "" \
                "%install" \
                "rm -rf %{buildroot}" \
                "mkdir -p %{buildroot}" \
                "cp -a /workspace/staging/. %{buildroot}/" \
                "" \
                "%files" \
                "/usr/*" \
                "%config(noreplace) /etc/kuzpkg.conf" \
                "%config(noreplace) /etc/makepkg.conf" \
                "%config(noreplace) /etc/makepkg.conf.d/fortran.conf" \
                "%config(noreplace) /etc/makepkg.conf.d/rust.conf" \
                "" \
                "%changelog" \
                "* $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1" \
                "- Daily Fedora build" \
                > rpm-build/SPECS/kuzpkg.spec

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: RPM was not produced"
                find rpm-build/RPMS -type f -print
                exit 1
              fi

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}.rpm"

              cp "$RPM_FILE" "$OUTPUT"

              rpm -qip "$RPM_FILE"

              test -f "$OUTPUT"
            '

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: "kuzpkg-rpm-${{ matrix.name }}"
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


