            ca-certificates \
            git

      - name: Build native .deb O3
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          TAG="$(
            git describe --tags --abbrev=0 2>/dev/null || true
          )"

          [ -n "$TAG" ] || TAG="0.0.0"

          SAFE_TAG="$(
            printf '%s' "$TAG" |
              sed 's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          DEB_VERSION="$(
            printf '%s' "$TAG" |
