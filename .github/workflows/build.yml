          if [ "${{ matrix.mode }}" = "docker" ]; then
            command -v docker
            docker --version
          fi

      - name: Install native O3 dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
