                -tf \
                "$OUTPUT" \
                >/dev/null

              test \
                -f \
                "$OUTPUT"

              echo "Created:"
              ls -lh "$OUTPUT"
            '

      - name: Upload Kuzpkg O3 package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst-o3
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
