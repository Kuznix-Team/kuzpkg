  # ============================================================
  # KUZPKG .KUZPKG.TAR.ZST
  #
  # Build makepkg from the current Kuzpkg source tree first,
  # then use that freshly-built makepkg to package Kuzpkg.
  # ==============================================================

  kuzpkg-tar-zst:
    name: ".kuzpkg.tar.zst - Kuzpkg makepkg"
    runs-on: ubuntu-24.04

    env:
      PACKAGE_VARIANT: normal
      O3_FLAG: ""

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates

          command -v docker
          docker --version

      - name: Build Kuzpkg and Kuzpkg makepkg
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e PACKAGE_VARIANT \
            -e O3_FLAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '

              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext

              # --------------------------------------------------
              # Build Kuzpkg source normally.
              # --------------------------------------------------

              rm -rf \
                source-build \
                kuzpkg-install \
                package-build \
                dist

              mkdir -p \
                dist

              meson setup \
                source-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C \
                source-build

              meson install \
                -C \
                source-build \
                --destdir \
                "$PWD/kuzpkg-install" \
                --no-rebuild \
                --strip

              # --------------------------------------------------
              # Verify Kuzpkg makepkg was installed.
              # --------------------------------------------------

              MAKEPKG_PATH="/workspace/kuzpkg-install/usr/bin/makepkg"

              if [ ! -x "$MAKEPKG_PATH" ]; then
                echo "ERROR: makepkg was not installed by Kuzpkg"
                find /workspace/kuzpkg-install -type f -o -type l | sort
                exit 1
              fi

              echo "Using Kuzpkg makepkg:"
              "$MAKEPKG_PATH" --version || true

              # --------------------------------------------------
              # Create package definition.
              # No heredoc.
              # --------------------------------------------------

              TAG="$(
                git describe --tags --abbrev=0 2>/dev/null || true
              )"

              [ -n "$TAG" ] || TAG="0.0.0"

              VERSION="$(
                printf "%s" "$TAG" |
                  sed \
                    "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              rm -rf \
                package-build

              mkdir -p \
                package-build

              printf "%s\n" \
                "pkgname=kuzpkg" \
                "pkgver=${VERSION}" \
                "pkgrel=1" \
                "pkgdesc=\"kuzpkg package manager\"" \
                "arch=(x86_64)" \
                "license=(GPL)" \
                "depends=(bash libarchive curl gpgme openssl nettle libseccomp)" \
                "" \
                "build() {" \
                "    meson setup build --buildtype=release --prefix=/usr" \
                "    meson compile -C build" \
                "}" \
                "" \
                "package() {" \
                "    meson install -C build --destdir \"\$pkgdir\" --no-rebuild --strip" \
                "}" \
                > package-build/PKGBUILD

              # --------------------------------------------------
              # Run makepkg built from Kuzpkg source.
              # --------------------------------------------------

              useradd \
                -m \
                builder

              chown \
                -R \
                builder:builder \
                /workspace

              su builder -c "
                cd /workspace/package-build
                PATH=/workspace/kuzpkg-install/usr/bin:\$PATH \
                /workspace/kuzpkg-install/usr/bin/makepkg \
                  --syncdeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              chown \
                -R \
                root:root \
                /workspace

              # --------------------------------------------------
              # Find package.
              # --------------------------------------------------

              PKG_FILE="$(
                find \
                  package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Kuzpkg makepkg did not produce package"
                find package-build -maxdepth 1 -type f -print
                exit 1
              fi

              BASE="$(
                basename \
                  "$PKG_FILE" \
                  ".pkg.tar.zst"
              )"

              cp \
                "$PKG_FILE" \
                "dist/${BASE}.kuzpkg.tar.zst"

              tar \
                -tf \
                "dist/${BASE}.kuzpkg.tar.zst" \
                >/dev/null

              test \
                -f \
                "dist/${BASE}.kuzpkg.tar.zst"
            '

      - name: Upload Kuzpkg package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


