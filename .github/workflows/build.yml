name: Build kuzpkg packages

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

# ============================================================
# TARGETS
#
# Native:
#   Ubuntu 26.04 x86_64       .deb
#   Ubuntu 26.04 ARM64        .deb
#   Debian unstable x86_64    .deb
#   Debian unstable ARM64     .deb
#
# Generic Docker:
#   x86_64
#   ARM64
#   PPC64LE
#   RISC-V64
#   ARMv7
#   S390X
#
# Formats:
#   .deb
#   .rpm
#   .pkg.tar.zst
#   .kuzpkg.tar.zst
# ============================================================


# ============================================================
# DEB
# ============================================================

jobs:

  deb:
    name: ".deb - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ----------------------------------------------------
          # Native Ubuntu 26.04
          # ----------------------------------------------------

          - name: ubuntu-26.04
            runner: ubuntu-26.04
            mode: native
            arch: amd64

          - name: ubuntu-26.04-arm
            runner: ubuntu-26.04-arm
            mode: native
            arch: arm64

          # ----------------------------------------------------
          # Debian unstable
          #
          # Uses Docker so the actual userspace is Debian
          # unstable.
          # ----------------------------------------------------

          - name: debian-unstable
            runner: ubuntu-26.04
            mode: docker
            image: debian:unstable
            platform: linux/amd64
            arch: amd64

          - name: debian-unstable-arm
            runner: ubuntu-26.04-arm
            mode: docker
            image: debian:unstable
            platform: linux/arm64
            arch: arm64

          # ----------------------------------------------------
          # Generic Ubuntu 26.04 Docker
          # ----------------------------------------------------

          - name: generic-amd64
            runner: ubuntu-26.04
            mode: docker
            image: ubuntu:26.04
            platform: linux/amd64
            arch: amd64

          - name: generic-arm64
            runner: ubuntu-26.04
            mode: docker
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: arm64

          - name: generic-ppc64le
            runner: ubuntu-26.04
            mode: docker
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64le

          - name: generic-riscv64
            runner: ubuntu-26.04
            mode: docker
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-armv7
            runner: ubuntu-26.04
            mode: docker
            image: arm32v7/ubuntu:26.04
            platform: linux/arm/v7
            arch: armhf

          - name: generic-s390x
            runner: ubuntu-26.04
            mode: docker
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true


      # ========================================================
      # VERSION
      # ========================================================

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            git tag --list
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $GIT_TAG"
          echo "Package version: $PACKAGE_VERSION"


      # ========================================================
      # PREPARE RUNNER
      # ========================================================

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            qemu-user-static

          docker --version


      # ========================================================
      # ENABLE BINfmt FOR GENERIC DOCKER TARGETS
      # ========================================================

      - name: Enable foreign architecture emulation
        if: matrix.mode == 'docker'
        run: |
          set -euxo pipefail

          docker run \
            --privileged \
            --rm \
            tonistiigi/binfmt:latest \
            --install all


      # ========================================================
      # NATIVE DEPENDENCIES
      # ========================================================

      - name: Install native dependencies
        if: matrix.mode == 'native'
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            zstd \
            libarchive-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libssl-dev \
            nettle-dev \
            libseccomp-dev \
            file \
            gettext \
            ca-certificates \
            git \
            dpkg-dev


      # ========================================================
      # NATIVE DEB
      # ========================================================

      - name: Build native .deb
        if: matrix.mode == 'native'
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            deb-root/usr \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr

          meson compile \
            -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a \
            staging/usr/. \
            deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc

            cp -a \
              staging/etc/. \
              deb-root/etc/
          fi

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${PACKAGE_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb \
            --info \
            "$DEB_FILE"

          test \
            -f \
            "$DEB_FILE"


      # ========================================================
      # DOCKER DEB
      # ========================================================

      - name: Build Docker .deb
        if: matrix.mode == 'docker'
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$TARGET_PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                dpkg-dev

              rm -rf \
                build \
                staging \
                deb-root \
                dist

              mkdir -p \
                build \
                staging \
                deb-root/DEBIAN \
                deb-root/usr \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a \
                staging/usr/. \
                deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc

                cp -a \
                  staging/etc/. \
                  deb-root/etc/
              fi

              printf "%s\n" \
                "Package: kuzpkg" \
                "Version: ${PACKAGE_VERSION}" \
                "Section: admin" \
                "Priority: optional" \
                "Architecture: ${TARGET_ARCH}" \
                "Maintainer: Kuznix Team" \
                "Description: kuzpkg package manager" \
                " Package manager for Kuznix Linux." \
                > deb-root/DEBIAN/control

              DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$DEB_FILE"

              dpkg-deb \
                --info \
                "$DEB_FILE"

              test \
                -f \
                "$DEB_FILE"
            '


      # ========================================================
      # UPLOAD DEB
      # ========================================================

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # RPM
  # ============================================================

  rpm:
    name: ".rpm - ${{ matrix.name }}"
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: generic-amd64
            image: ubuntu:26.04
            platform: linux/amd64
            arch: x86_64

          - name: generic-arm64
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: aarch64

          - name: generic-ppc64le
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64le

          - name: generic-riscv64
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-armv7
            image: arm32v7/ubuntu:26.04
            platform: linux/arm/v7
            arch: armv7hl

          - name: generic-s390x
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x


    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true


      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: No Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          RPM_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              sed \
                's/-/~/g; s/+/_/g'
          ).${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "rpm_version=$RPM_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"


      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            qemu-user-static

          docker --version


      - name: Enable foreign architecture emulation
        run: |
          set -euxo pipefail

          docker run \
            --privileged \
            --rm \
            tonistiigi/binfmt:latest \
            --install all


      - name: Build RPM
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$TARGET_PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e RPM_VERSION \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                rpm

              rm -rf \
                build \
                staging \
                rpm-build \
                dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cat > rpm-build/SPECS/kuzpkg.spec <<SPEC
              Name:           kuzpkg
              Version:        ${RPM_VERSION}
              Release:        1
              Summary:        kuzpkg package manager
              License:        GPL-2.0-or-later
              BuildArch:      ${TARGET_ARCH}

              %description
              Package manager for Kuznix Linux.

              %prep

              %build

              %install
              rm -rf %{buildroot}
              mkdir -p %{buildroot}
              cp -a /workspace/staging/. %{buildroot}/

              %files
              /usr/*
              /etc/kuzpkg.conf
              /etc/makepkg.conf
              /etc/makepkg.conf.d/*

              %changelog
              * $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1
              - Generic Ubuntu 26.04 build
              SPEC

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find \
                  rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: RPM was not produced."
                exit 1
              fi

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.rpm"

              cp \
                "$RPM_FILE" \
                "$OUTPUT"

              rpm -qip \
                "$RPM_FILE"

              test \
                -f \
                "$OUTPUT"
            '


      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # GENERIC .PKG.TAR.ZST
  #
  # Built INSIDE Ubuntu 26.04 architecture containers.
  #
  # Kuzpkg is bootstrapped first, then its own makepkg is used
  # to build the final .pkg.tar.zst.
  # ============================================================

  pkg-tar-zst:
    name: ".pkg.tar.zst - ${{ matrix.name }}"
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: generic-amd64
            image: ubuntu:26.04
            platform: linux/amd64
            arch: x86_64

          - name: generic-arm64
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: aarch64

          - name: generic-ppc64le
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64le

          - name: generic-riscv64
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-armv7
            image: arm32v7/ubuntu:26.04
            platform: linux/arm/v7
            arch: armv7h

          - name: generic-s390x
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x


    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true


      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: No Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          ARCH_TAG_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              tr '-' '.'
          )"

          ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "arch_pkgver=$ARCH_PKGVER"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"


      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            qemu-user-static

          docker --version


      - name: Enable foreign architecture emulation
        run: |
          set -euxo pipefail

          docker run \
            --privileged \
            --rm \
            tonistiigi/binfmt:latest \
            --install all


      - name: Build generic .pkg.tar.zst
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          ARCH_PKGVER: ${{ steps.version.outputs.arch_pkgver }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$TARGET_PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e ARCH_PKGVER \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                tar

              rm -rf \
                /tmp/kuzpkg-install \
                /tmp/package-build \
                /tmp/kuzpkg-source.tar.gz

              mkdir -p \
                /tmp/package-build \
                /tmp/kuzpkg-install

              # ------------------------------------------------
              # Bootstrap Kuzpkg
              # ------------------------------------------------

              test \
                -f \
                /workspace/meson.build

              meson setup \
                /tmp/kuzpkg-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C /tmp/kuzpkg-build

              meson install \
                -C /tmp/kuzpkg-build \
                --destdir /tmp/kuzpkg-install \
                --no-rebuild \
                --strip

              MAKEPKG="/tmp/kuzpkg-install/usr/bin/makepkg"

              if [ ! -x "$MAKEPKG" ]; then
                echo "ERROR: makepkg was not installed."

                find \
                  /tmp/kuzpkg-install \
                  -maxdepth 6 \
                  \( -type f -o -type l \) \
                  -print

                exit 1
              fi

              "$MAKEPKG" --version || true

              # ------------------------------------------------
              # Create clean source archive
              # ------------------------------------------------

              tar \
                --exclude=.git \
                -C /workspace \
                -czf /tmp/kuzpkg-source.tar.gz \
                .

              cp \
                /tmp/kuzpkg-source.tar.gz \
                /tmp/package-build/kuzpkg-source.tar.gz

              # ------------------------------------------------
              # Create PKGBUILD
              #
              # NO heredoc here.
              #
              # printf avoids the previous EOF failure.
              # ------------------------------------------------

              printf "%s\n" \
                "pkgname=kuzpkg" \
                "pkgver=${ARCH_PKGVER}" \
                "pkgrel=1" \
                "pkgdesc=\"kuzpkg package manager\"" \
                "arch=(${TARGET_ARCH})" \
                "license=(GPL-2.0-or-later)" \
                "depends=(bash libarchive curl gpgme openssl nettle libseccomp)" \
                "makedepends=(meson ninja pkgconf)" \
                "source=(kuzpkg-source.tar.gz)" \
                "sha256sums=(SKIP)" \
                "" \
                "build() {" \
                "    cd \"\$srcdir\"" \
                "    test -f meson.build" \
                "    meson setup build --buildtype=release --prefix=/usr" \
                "    meson compile -C build" \
                "}" \
                "" \
                "package() {" \
                "    cd \"\$srcdir\"" \
                "    meson install -C build --destdir \"\$pkgdir\" --no-rebuild --strip" \
                "}" \
                > /tmp/package-build/PKGBUILD

              echo "Generated PKGBUILD:"
              cat /tmp/package-build/PKGBUILD

              # ------------------------------------------------
              # Builder
              # ------------------------------------------------

              if ! id builder >/dev/null 2>&1; then
                useradd \
                  --create-home \
                  --shell /bin/bash \
                  builder
              fi

              chown \
                -R \
                builder:builder \
                /tmp/package-build \
                /tmp/kuzpkg-install

              # ------------------------------------------------
              # Build with Kuzpkg makepkg
              # ------------------------------------------------

              su - builder -c "
                cd /tmp/package-build

                export PATH=/tmp/kuzpkg-install/usr/bin:/usr/bin:/bin

                /tmp/kuzpkg-install/usr/bin/makepkg \
                  --nodeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              PKG_FILE="$(
                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Generic .pkg.tar.zst was not produced."

                find \
                  /tmp/package-build \
                  -maxdepth 2 \
                  -type f \
                  -print

                exit 1
              fi

              OUTPUT="/workspace/dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${ARCH_PKGVER}.pkg.tar.zst"

              cp \
                "$PKG_FILE" \
                "$OUTPUT"

              test \
                -f \
                "$OUTPUT"

              tar \
                -tf \
                "$OUTPUT" \
                >/dev/null

              echo "Created:"
              ls -lh \
                "$OUTPUT"
            '


      - name: Verify package
        run: |
          set -euxo pipefail

          PKG_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*.pkg.tar.zst" |
            head -n 1
          )"

          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: No .pkg.tar.zst found."
            exit 1
          fi

          ls -lh "$PKG_FILE"


      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-pkg-tar-zst-${{ matrix.name }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # GENERIC .KUZPKG.TAR.ZST
  #
  # Uses Kuzpkg's OWN makepkg to package Kuzpkg itself.
  # ============================================================

  kuzpkg-tar-zst:
    name: ".kuzpkg.tar.zst - ${{ matrix.name }}"
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: generic-amd64
            image: ubuntu:26.04
            platform: linux/amd64
            arch: x86_64

          - name: generic-arm64
            image: arm64v8/ubuntu:26.04
            platform: linux/arm64
            arch: aarch64

          - name: generic-ppc64le
            image: ppc64le/ubuntu:26.04
            platform: linux/ppc64le
            arch: ppc64le

          - name: generic-riscv64
            image: riscv64/ubuntu:26.04
            platform: linux/riscv64
            arch: riscv64

          - name: generic-armv7
            image: arm32v7/ubuntu:26.04
            platform: linux/arm/v7
            arch: armv7h

          - name: generic-s390x
            image: s390x/ubuntu:26.04
            platform: linux/s390x
            arch: s390x


    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true


      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: No Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          ARCH_TAG_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              tr '-' '.'
          )"

          ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "arch_pkgver=$ARCH_PKGVER"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"


      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            qemu-user-static

          docker --version


      - name: Enable foreign architecture emulation
        run: |
          set -euxo pipefail

          docker run \
            --privileged \
            --rm \
            tonistiigi/binfmt:latest \
            --install all


      - name: Build .kuzpkg.tar.zst
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          ARCH_PKGVER: ${{ steps.version.outputs.arch_pkgver }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$TARGET_PLATFORM" \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e ARCH_PKGVER \
            -e SAFE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                ca-certificates \
                git \
                tar

              rm -rf \
                /tmp/kuzpkg-build \
                /tmp/kuzpkg-install \
                /tmp/package-build \
                /tmp/kuzpkg-source.tar.gz

              mkdir -p \
                /tmp/package-build \
                /tmp/kuzpkg-install

              # ------------------------------------------------
              # Bootstrap Kuzpkg
              # ------------------------------------------------

              test \
                -f \
                /workspace/meson.build

              meson setup \
                /tmp/kuzpkg-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C /tmp/kuzpkg-build

              meson install \
                -C /tmp/kuzpkg-build \
                --destdir /tmp/kuzpkg-install \
                --no-rebuild \
                --strip

              MAKEPKG="/tmp/kuzpkg-install/usr/bin/makepkg"

              if [ ! -x "$MAKEPKG" ]; then
                echo "ERROR: Kuzpkg makepkg was not installed."

                find \
                  /tmp/kuzpkg-install \
                  -maxdepth 6 \
                  \( -type f -o -type l \) \
                  -print

                exit 1
              fi

              echo "Bootstrapped Kuzpkg:"
              "$MAKEPKG" --version || true

              # ------------------------------------------------
              # Source archive
              # ------------------------------------------------

              tar \
                --exclude=.git \
                -C /workspace \
                -czf /tmp/kuzpkg-source.tar.gz \
                .

              cp \
                /tmp/kuzpkg-source.tar.gz \
                /tmp/package-build/kuzpkg-source.tar.gz

              # ------------------------------------------------
              # IMPORTANT:
              #
              # No cat <<EOF.
              #
              # printf avoids the nested-shell heredoc bug.
              # ------------------------------------------------

              printf "%s\n" \
                "pkgname=kuzpkg" \
                "pkgver=${ARCH_PKGVER}" \
                "pkgrel=1" \
                "pkgdesc=\"kuzpkg package manager\"" \
                "arch=(${TARGET_ARCH})" \
                "license=(GPL-2.0-or-later)" \
                "depends=(bash libarchive curl gpgme openssl nettle libseccomp)" \
                "makedepends=(meson ninja pkgconf)" \
                "source=(kuzpkg-source.tar.gz)" \
                "sha256sums=(SKIP)" \
                "" \
                "build() {" \
                "    cd \"\$srcdir\"" \
                "    test -f meson.build" \
                "    meson setup build --buildtype=release --prefix=/usr" \
                "    meson compile -C build" \
                "}" \
                "" \
                "package() {" \
                "    cd \"\$srcdir\"" \
                "    meson install -C build --destdir \"\$pkgdir\" --no-rebuild --strip" \
                "}" \
                > /tmp/package-build/PKGBUILD

              echo "Generated PKGBUILD:"
              cat \
                /tmp/package-build/PKGBUILD

              # ------------------------------------------------
              # Builder
              #
              # Explicitly create it BEFORE su.
              # ------------------------------------------------

              if ! id builder >/dev/null 2>&1; then
                useradd \
                  --create-home \
                  --shell /bin/bash \
                  builder
              fi

              chown \
                -R \
                builder:builder \
                /tmp/package-build \
                /tmp/kuzpkg-install

              # ------------------------------------------------
              # SELF-HOSTING BUILD
              #
              # The installed Kuzpkg makepkg builds Kuzpkg.
              # ------------------------------------------------

              su - builder -c "
                cd /tmp/package-build

                export PATH=/tmp/kuzpkg-install/usr/bin:/usr/bin:/bin

                /tmp/kuzpkg-install/usr/bin/makepkg \
                  --nodeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              PKG_FILE="$(
                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Kuzpkg package was not produced."

                find \
                  /tmp/package-build \
                  -maxdepth 2 \
                  -type f \
                  -print

                exit 1
              fi

              echo "Generated package:"
              ls -lh \
                "$PKG_FILE"

              BASE="$(
                basename \
                  "$PKG_FILE" \
                  ".pkg.tar.zst"
              )"

              OUTPUT="/workspace/dist/${BASE}.kuzpkg.tar.zst"

              cp \
                "$PKG_FILE" \
                "$OUTPUT"

              test \
                -f \
                "$OUTPUT"

              tar \
                -tf \
                "$OUTPUT" \
                >/dev/null

              echo "Final Kuzpkg package:"
              ls -lh \
                "$OUTPUT"
            '


      - name: Verify Kuzpkg package
        run: |
          set -euxo pipefail

          PKG_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*.kuzpkg.tar.zst" |
            head -n 1
          )"

          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: No .kuzpkg.tar.zst artifact found."

            find \
              dist \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          echo "Kuzpkg artifact:"
          ls -lh \
            "$PKG_FILE"


      - name: Upload Kuzpkg package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst-${{ matrix.name }}
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
