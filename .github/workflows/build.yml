                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              cp -a \
                staging/usr/. \
                deb-root/usr/

              if [ -d staging/etc ]; then
                mkdir -p deb-root/etc

                cp -a \
                  staging/etc/. \
                  deb-root/etc/
              fi

              printf "%s\n" \
                "Package: kuzpkg" \
                "Version: ${PACKAGE_VERSION}" \
                "Section: admin" \
                "Priority: optional" \
                "Architecture: ${TARGET_ARCH}" \
                "Maintainer: Kuznix Team" \
                "Description: kuzpkg package manager" \
                " Package manager for Kuznix Linux (O3 build)." \
                > deb-root/DEBIAN/control

              DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}-o3.deb"

              dpkg-deb \
                --build \
                --root-owner-group \
                deb-root \
                "$DEB_FILE"

              dpkg-deb \
                --info \
                "$DEB_FILE"
            '

      - name: Upload .deb O3
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-deb-${{ matrix.name }}-o3
          path: dist/*-o3.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # RPM
  # ============================================================

  rpm:
    name: ".rpm - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
            arch: x86_64

          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
            arch: aarch64

          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
            arch: x86_64

          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
            arch: aarch64

          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
            arch: x86_64

          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide
            arch: aarch64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          RPM_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              sed 's/-/~/g'
          ).${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "rpm_version=$RPM_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $GIT_TAG"
          echo "Package version: $PACKAGE_VERSION"
          echo "RPM version: $RPM_VERSION"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Build RPM
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e RPM_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '
              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                rpm-build \
                rpmdevtools

              rm -rf \
                build \
                staging \
                rpm-build \
                dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              printf "%s\n" \
                "Name:           kuzpkg" \
                "Version:        ${RPM_VERSION}" \
                "Release:        1%{?dist}" \
                "Summary:        kuzpkg package manager" \
                "License:        GPLv2+" \
                "ExclusiveArch:  ${TARGET_ARCH}" \
                "" \
                "%description" \
                "Package manager for Kuznix Linux." \
                "" \
                "%prep" \
                "" \
                "%build" \
                "" \
                "%install" \
                "rm -rf %{buildroot}" \
                "mkdir -p %{buildroot}" \
                "cp -a /workspace/staging/. %{buildroot}/" \
                "" \
                "%files" \
                "/usr/*" \
                "" \
                "%changelog" \
                "* $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1" \
                "- Daily Fedora build" \
                > rpm-build/SPECS/kuzpkg.spec

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find \
                  rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: RPM was not produced."
                exit 1
              fi

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}.rpm"

              cp \
                "$RPM_FILE" \
                "$OUTPUT"

              rpm -qip \
                "$RPM_FILE"

              test \
                -f \
                "$OUTPUT"
            '

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # RPM O3
  # ============================================================

  rpm-o3:
    name: ".rpm O3 - ${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: fedora-43
            runner: ubuntu-24.04
            image: fedora:43
            arch: x86_64

          - name: fedora-43-arm
            runner: ubuntu-26.04-arm
            image: fedora:43
            arch: aarch64

          - name: fedora-44
            runner: ubuntu-24.04
            image: fedora:44
            arch: x86_64

          - name: fedora-44-arm
            runner: ubuntu-26.04-arm
            image: fedora:44
            arch: aarch64

          - name: fedora-rawhide
            runner: ubuntu-24.04
            image: fedora:rawhide
            arch: x86_64

          - name: fedora-rawhide-arm
            runner: ubuntu-26.04-arm
            image: fedora:rawhide
            arch: aarch64

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          GIT_TAG="$(
            git tag --sort=-creatordate |
            head -n 1
          )"

          if [ -z "$GIT_TAG" ]; then
            GIT_TAG="$(
              git describe \
                --tags \
                --abbrev=0 \
                2>/dev/null || true
            )"
          fi

          if [ -z "$GIT_TAG" ]; then
            echo "ERROR: Repository has no Git tag."
            exit 1
          fi

          TAG_VERSION="${GIT_TAG#v}"
          DATE_VERSION="$(date -u +%Y%m%d)"

          PACKAGE_VERSION="${TAG_VERSION}-${DATE_VERSION}"

          RPM_VERSION="$(
            printf '%s' "$TAG_VERSION" |
              sed 's/-/~/g'
          ).${DATE_VERSION}"

          SAFE_TAG="$(
            printf '%s' "$GIT_TAG" |
              sed \
                's#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g'
          )"

          {
            echo "git_tag=$GIT_TAG"
            echo "tag_version=$TAG_VERSION"
            echo "date_version=$DATE_VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "rpm_version=$RPM_VERSION"
            echo "safe_tag=$SAFE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $GIT_TAG"
          echo "Package version: $PACKAGE_VERSION"
          echo "RPM version: $RPM_VERSION"

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          docker --version

      - name: Build RPM O3
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RPM_VERSION: ${{ steps.version.outputs.rpm_version }}
          SAFE_TAG: ${{ steps.version.outputs.safe_tag }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -e PACKAGE_VERSION \
            -e RPM_VERSION \
            -e SAFE_TAG \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '
              dnf -y update

              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                rpm-build \
                rpmdevtools

              rm -rf \
                build \
                staging \
                rpm-build \
                dist

              mkdir -p \
                build \
                staging \
                rpm-build/BUILD \
                rpm-build/BUILDROOT \
                rpm-build/RPMS \
                rpm-build/SOURCES \
                rpm-build/SPECS \
                rpm-build/SRPMS \
                dist

              meson setup \
                build \
                --buildtype=release \
                --prefix=/usr \
                -Denable-o3=true

              meson compile \
                -C build

              meson install \
                -C build \
                --destdir "$PWD/staging" \
                --no-rebuild \
                --strip

              printf "%s\n" \
                "Name:           kuzpkg" \
                "Version:        ${RPM_VERSION}" \
                "Release:        1%{?dist}" \
                "Summary:        kuzpkg package manager" \
                "License:        GPLv2+" \
                "ExclusiveArch:  ${TARGET_ARCH}" \
                "" \
                "%description" \
                "Package manager for Kuznix Linux (O3 build)." \
                "" \
                "%prep" \
                "" \
                "%build" \
                "" \
                "%install" \
                "rm -rf %{buildroot}" \
                "mkdir -p %{buildroot}" \
                "cp -a /workspace/staging/. %{buildroot}/" \
                "" \
                "%files" \
                "/usr/*" \
                "" \
                "%changelog" \
                "* $(date -u "+%a %b %d %Y") Kuznix Team - ${RPM_VERSION}-1" \
                "- Daily Fedora O3 build" \
                > rpm-build/SPECS/kuzpkg.spec

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              RPM_FILE="$(
                find \
                  rpm-build/RPMS \
                  -type f \
                  -name "*.rpm" |
                head -n 1
              )"

              if [ -z "$RPM_FILE" ]; then
                echo "ERROR: RPM O3 was not produced."
                exit 1
              fi

              OUTPUT="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-${PACKAGE_VERSION}-o3.rpm"

              cp \
                "$RPM_FILE" \
                "$OUTPUT"

              rpm -qip \
                "$RPM_FILE"

              test \
                -f \
                "$OUTPUT"
            '

      - name: Upload RPM O3
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-${{ matrix.name }}-o3
          path: dist/*-o3.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # ARCH .PKG.TAR.ZST
  # ============================================================

  pkg-tar-zst:
    name: ".pkg.tar.zst - Arch Linux"
    runs-on: ubuntu-24.04

    steps:

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates

          docker --version

      - name: Build Arch package
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            -v "$PWD/dist:/export" \
            archlinux:latest \
            bash -euxo pipefail -c '

              # ------------------------------------------------
              # Update Arch container
              # ------------------------------------------------

              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext

              # ------------------------------------------------
              # Clean build directories
              # ------------------------------------------------

              rm -rf \
                /tmp/kuzpkg \
                /tmp/package-build \
                /tmp/kuzpkg-source.tar.gz

              mkdir -p \
                /tmp/package-build

              # ------------------------------------------------
              # Clone repository
              # ------------------------------------------------

              git clone \
                --filter=blob:none \
                https://github.com/Kuznix-Team/kuzpkg.git \
                /tmp/kuzpkg

              cd /tmp/kuzpkg

              git fetch \
                --tags \
                origin

              GIT_TAG="$(
                git tag \
                  --sort=-creatordate |
                head -n 1
              )"

              if [ -z "$GIT_TAG" ]; then
                GIT_TAG="$(
                  git describe \
                    --tags \
                    --abbrev=0 \
                    2>/dev/null || true
                )"
              fi

              if [ -z "$GIT_TAG" ]; then
                echo "ERROR: Repository has no Git tag."
                git tag --list
                exit 1
              fi

              TAG_VERSION="${GIT_TAG#v}"
              DATE_VERSION="$(date -u +%Y%m%d)"

              ARCH_TAG_VERSION="$(
                printf "%s" "$TAG_VERSION" |
                  tr "-" "."
              )"

              ARCH_PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

              echo "Git tag: ${GIT_TAG}"
              echo "Arch pkgver: ${ARCH_PKGVER}"

              # ------------------------------------------------
              # Verify source tree
              # ------------------------------------------------

              test \
                -f \
                /tmp/kuzpkg/meson.build

              # ------------------------------------------------
              # Create source archive.
              #
              # The contents are stored at the ROOT of the
              # archive, so makepkg extracts:
              #
              #   $srcdir/meson.build
              #   $srcdir/src/...
              #
              # instead of:
              #
              #   $srcdir/source/...
              #
              # ------------------------------------------------

              tar \
                --exclude=.git \
                -C /tmp/kuzpkg \
                -czf /tmp/kuzpkg-source.tar.gz \
                .

              test \
                -f \
                /tmp/kuzpkg-source.tar.gz

              cp \
                /tmp/kuzpkg-source.tar.gz \
                /tmp/package-build/kuzpkg-source.tar.gz

              # ------------------------------------------------
              # Generate PKGBUILD
              # ------------------------------------------------

              cat > /tmp/package-build/PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${ARCH_PKGVER}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=(x86_64)
              license=(GPL-2.0-or-later)
              depends=(
                bash
                libarchive
                curl
                gpgme
                openssl
                nettle
                libseccomp
              )
              makedepends=(
                meson
                ninja
                pkgconf
              )
              source=(
                kuzpkg-source.tar.gz
              )
              sha256sums=(
                SKIP
              )

              build() {
                  cd "\$srcdir"

                  test -f meson.build

                  meson setup \
                    build \
                    --buildtype=release \
                    --prefix=/usr

                  meson compile \
                    -C build
              }

              package() {
                  cd "\$srcdir"

                  meson install \
                    -C build \
                    --destdir "\$pkgdir" \
                    --no-rebuild \
                    --strip
              }
              EOF

              echo "Generated PKGBUILD:"
              cat \
                /tmp/package-build/PKGBUILD

              # ------------------------------------------------
              # Create unprivileged build user
              # ------------------------------------------------

              useradd \
                --create-home \
                builder

              chown \
                -R \
                builder:builder \
                /tmp/package-build

              # ------------------------------------------------
              # Build package
              #
              # --cleanbuild is SAFE here because the source is
              # supplied through source=().
              # ------------------------------------------------

              su builder -c "
                cd /tmp/package-build

                /usr/bin/makepkg \
                  --nodeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              # ------------------------------------------------
              # Locate generated package
              # ------------------------------------------------

              PKG_FILE="$(
                find \
                  /tmp/package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Arch package was not produced."

                find \
                  /tmp/package-build \
                  -maxdepth 2 \
                  -type f \
                  -print

                exit 1
              fi

              echo "Generated Arch package:"
              ls -lh \
                "$PKG_FILE"

              # ------------------------------------------------
              # Copy artifact
              # ------------------------------------------------

              cp \
                "$PKG_FILE" \
                "/export/$(basename "$PKG_FILE")"

              test \
                -f \
                "/export/$(basename "$PKG_FILE")"

              tar \
                -tf \
                "/export/$(basename "$PKG_FILE")" \
                >/dev/null

              echo "Final artifact:"
              ls -lh /export
            '

      - name: Verify Arch package
        run: |
          set -euxo pipefail

          PKG_FILE="$(
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -name "*.pkg.tar.zst" |
            head -n 1
          )"

          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: No Arch package found."
            find \
              dist \
              -maxdepth 1 \
              -type f \
              -print
            exit 1
          fi

          echo "Arch artifact:"
          ls -lh "$PKG_FILE"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-pkg-tar-zst
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


