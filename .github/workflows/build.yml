                  -maxdepth 1 \
                  -type f \
                  -print

                exit 1
              fi

              cp \
                "$PKG_FILE" \
                /export/

              tar \
                -tf \
                "/export/$(basename "$PKG_FILE")" \
                >/dev/null

              echo "Created:"
              ls -lh /export/
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-pkg-tar-zst
          path: dist/*.pkg.tar.zst
