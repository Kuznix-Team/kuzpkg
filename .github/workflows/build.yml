  # ============================================================
  # KUZPKG .KUZPKG.TAR.ZST
  #
  # Important:
  #
  # makepkg expects a source archive.
  # We therefore create kuzpkg-source.tar.gz from the checkout,
  # put it in PKGBUILD source=(), and build from the extracted
  # source directory.
  # ============================================================

  kuzpkg-tar-zst:
    name: ".kuzpkg.tar.zst - Kuzpkg makepkg"
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates

          command -v docker
          docker --version

      - name: Build .kuzpkg.tar.zst
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '

              pacman -Syu --noconfirm

              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext

              rm -rf \
                source-build \
                kuzpkg-install \
                package-build \
                dist \
                kuzpkg-source

              mkdir -p dist

              # ------------------------------------------------
              # Build Kuzpkg first.
              # ------------------------------------------------

              meson setup \
                source-build \
                --buildtype=release \
                --prefix=/usr

              meson compile \
                -C source-build

              meson install \
                -C source-build \
                --destdir "$PWD/kuzpkg-install" \
                --no-rebuild \
                --strip

              MAKEPKG_PATH="/workspace/kuzpkg-install/usr/bin/makepkg"

              if [ ! -x "$MAKEPKG_PATH" ]; then
                echo "ERROR: source-built makepkg is missing"

                find \
                  /workspace/kuzpkg-install \
                  -type f \
                  -o -type l

                exit 1
              fi

              echo "Using source-built makepkg:"
              "$MAKEPKG_PATH" --version || true

              # ------------------------------------------------
              # Get version.
              # ------------------------------------------------

              TAG="$(
                git describe --tags --abbrev=0 2>/dev/null || true
              )"

              [ -n "$TAG" ] || TAG="0.0.0"

              VERSION="$(
                printf "%s" "$TAG" |
                  sed "s/^v//; s/[^A-Za-z0-9._+]/./g"
              )"

              # ------------------------------------------------
              # Create a source archive.
              #
              # The archive contains the complete repository.
              # ------------------------------------------------

              tar \
                --exclude=.git \
                --exclude=build \
                --exclude=source-build \
                --exclude=kuzpkg-install \
                --exclude=package-build \
                --exclude=dist \
                -czf \
                /workspace/kuzpkg-source.tar.gz \
                .

              test \
                -f \
                /workspace/kuzpkg-source.tar.gz

              # ------------------------------------------------
              # Create package build directory.
              # ------------------------------------------------

              mkdir -p package-build

              # ------------------------------------------------
              # PKGBUILD
              #
              # No heredoc.
              # ------------------------------------------------

              printf "%s\n" \
                "pkgname=kuzpkg" \
                "pkgver=${VERSION}" \
                "pkgrel=1" \
                "pkgdesc=\"kuzpkg package manager\"" \
                "arch=(x86_64)" \
                "license=(GPL)" \
                "depends=(bash libarchive curl gpgme openssl nettle libseccomp)" \
                "source=(kuzpkg-source.tar.gz)" \
                "sha256sums=(SKIP)" \
                "" \
                "build() {" \
                "    cd \"\$srcdir\"" \
                "    meson setup build --buildtype=release --prefix=/usr" \
                "    meson compile -C build" \
                "}" \
                "" \
                "package() {" \
                "    cd \"\$srcdir\"" \
                "    meson install -C build --destdir \"\$pkgdir\" --no-rebuild --strip" \
                "}" \
                > package-build/PKGBUILD

              cp \
                /workspace/kuzpkg-source.tar.gz \
                package-build/kuzpkg-source.tar.gz

              # ------------------------------------------------
              # Create builder user.
              # ------------------------------------------------

              useradd \
                -m \
                builder

              chown \
                -R \
                builder:builder \
                /workspace

              # ------------------------------------------------
              # Run the MAKEPKG built by Kuzpkg.
              # ------------------------------------------------

              su builder -c "
                cd /workspace/package-build
                PATH=/workspace/kuzpkg-install/usr/bin:\$PATH
                /workspace/kuzpkg-install/usr/bin/makepkg \
                  --syncdeps \
                  --noconfirm \
                  --cleanbuild \
                  --clean
              "

              chown \
                -R \
                root:root \
                /workspace

              # ------------------------------------------------
              # Find generated package.
              # ------------------------------------------------

              PKG_FILE="$(
                find \
                  package-build \
                  -maxdepth 1 \
                  -type f \
                  -name "kuzpkg-*.pkg.tar.zst" |
                head -n 1
              )"

              if [ -z "$PKG_FILE" ]; then
                echo "ERROR: Kuzpkg makepkg generated no package"

                find \
                  package-build \
                  -maxdepth 1 \
                  -type f \
                  -print

                exit 1
              fi

              BASE="$(
                basename \
                  "$PKG_FILE" \
                  ".pkg.tar.zst"
              )"

              OUTPUT="dist/${BASE}.kuzpkg.tar.zst"

              cp \
                "$PKG_FILE" \
                "$OUTPUT"

              tar \
                -tf \
                "$OUTPUT" \
                >/dev/null

              test \
                -f \
                "$OUTPUT"

              echo "Created:"
              ls -lh "$OUTPUT"
            '

      - name: Upload Kuzpkg package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-kuzpkg-tar-zst
          path: dist/*.kuzpkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


