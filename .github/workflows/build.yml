          )"

          rm -rf \
            build \
            staging \
            deb-root \
            dist

          mkdir -p \
            build \
            staging \
            deb-root/DEBIAN \
            deb-root/usr \
            dist

          meson setup \
            build \
            --buildtype=release \
            --prefix=/usr \
            -Denable-o3=true

          meson compile -C build

          meson install \
            -C build \
            --destdir "$PWD/staging" \
            --no-rebuild \
            --strip

          cp -a staging/usr/. deb-root/usr/

          if [ -d staging/etc ]; then
            mkdir -p deb-root/etc
            cp -a staging/etc/. deb-root/etc/
          fi

          printf '%s\n' \
            "Package: kuzpkg" \
            "Version: ${DEB_VERSION}" \
            "Section: admin" \
            "Priority: optional" \
            "Architecture: ${TARGET_ARCH}" \
            "Maintainer: Kuznix Team" \
            "Description: kuzpkg package manager" \
            " Package manager for Kuznix Linux (O3 build)." \
            > deb-root/DEBIAN/control

          DEB_FILE="dist/kuzpkg-${SAFE_TAG}-${TARGET_NAME}-o3.deb"

          dpkg-deb \
            --build \
            --root-owner-group \
            deb-root \
            "$DEB_FILE"

          dpkg-deb --info "$DEB_FILE"

      - name: Build Debian Docker .deb O3
        if: matrix.mode == 'docker'
        env:
          DEBIAN_IMAGE: ${{ matrix.image }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail

          docker run \
            --rm \
            -e TARGET_NAME \
            -e TARGET_ARCH \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$DEBIAN_IMAGE" \
            bash -euxo pipefail -c '

              apt-get update

              apt-get install -y \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
