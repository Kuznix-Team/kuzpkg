        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          command -v docker >/dev/null
          docker --version

      - name: Build RPM O3
        env:
          TARGET_NAME: ${{ matrix.name }}
          FEDORA_IMAGE: ${{ matrix.image }}
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$FEDORA_IMAGE" \
            bash -euxo pipefail -c '
              dnf -y update
              dnf -y install \
                git \
                gcc \
                gcc-c++ \
                meson \
                ninja-build \
                pkgconf \
                zstd \
                libarchive-devel \
                libcurl-devel \
                gpgme-devel \
                openssl-devel \
                nettle-devel \
                libseccomp-devel \
                file \
                gettext \
                asciidoc \
                xmlto \
                rpm-build \
                rpmdevtools

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag="0.0.0"

              safe_tag="$(printf "%s" "$tag" | sed "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g")"
              rpm_version="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9._+]/./g")"

              rm -rf build staging rpm-build dist
              mkdir -p \
                rpm-build/BUILD \
