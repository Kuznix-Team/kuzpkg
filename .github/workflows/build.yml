                --no-rebuild \
                --strip

              cat > rpm-build/SPECS/kuzpkg.spec <<EOF
              Name: kuzpkg
              Version: ${rpm_version}
              Release: 1%{?dist}
              Summary: kuzpkg package manager
              License: GPLv2+

              %description
              Package manager for Kuznix Linux.

              %prep

              %build

              %install
              rm -rf %{buildroot}
              mkdir -p %{buildroot}
              cp -a /workspace/staging/. %{buildroot}/

              %files
              /usr/*
              %config(noreplace) /etc/kuzpkg.conf
              %config(noreplace) /etc/makepkg.conf
              %config(noreplace) /etc/makepkg.conf.d/fortran.conf
              %config(noreplace) /etc/makepkg.conf.d/rust.conf

              %changelog
              * $(date -u "+%a %b %d %Y") Kuznix Team - ${rpm_version}-1
              - Daily Fedora O3 build
              EOF

              rpmbuild \
                --define "_topdir /workspace/rpm-build" \
                -bb \
                rpm-build/SPECS/kuzpkg.spec

              rpm_file="$(find rpm-build/RPMS -type f -name "*.rpm" | head -n1)"
              test -n "$rpm_file"
              cp "$rpm_file" "dist/kuzpkg-${safe_tag}-${TARGET_NAME}-o3.rpm"
              rpm -qip "$rpm_file"
            '

      - name: Upload RPM O3 package
        uses: actions/upload-artifact@v4
        with:
          name: kuzpkg-rpm-o3-${{ matrix.name }}
          path: dist/*-o3.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # ============================================================
  # ARCH .PKG.TAR.ZST
  # ============================================================

  pkg-tar-zst:
    name: .pkg.tar.zst - Arch Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kuzpkg
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          command -v docker >/dev/null
          docker --version

      - name: Build Arch package
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed \
                base-devel \
                git \
                meson \
                ninja \
                pkgconf \
                zstd \
                libarchive \
                curl \
                gpgme \
                openssl \
                nettle \
                libseccomp \
                file \
                gettext \
                asciidoc

              tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              [ -n "$tag" ] || tag="0.0.0"
              ver="$(printf "%s" "$tag" | sed "s/^v//; s/[^A-Za-z0-9._+]/./g")"

              rm -rf build dist
              mkdir -p dist

              cat > PKGBUILD <<EOF
              pkgname=kuzpkg
              pkgver=${ver}
              pkgrel=1
              pkgdesc="kuzpkg package manager"
              arch=(x86_64)
              license=(GPL)
              depends=(bash libarchive curl gpgme openssl nettle libseccomp)

              build() {
                  meson setup build --buildtype=release --prefix=/usr
                  meson compile -C build
              }

              package() {
                  meson install -C build --destdir "$pkgdir" --no-rebuild --strip
              }
              EOF

