              mkdir -p \
                /tmp/pkg-root

              meson install \
                -C /tmp/kuzpkg-build \
                --destdir /tmp/pkg-root \
                --no-rebuild \
                --strip

              test \
                -x \
                /tmp/pkg-root/usr/bin/kuzpkg

              BUILD_DATE="$(
                date -u +%s
              )"

              # ------------------------------------------------
              # Metadata.
              # ------------------------------------------------

              printf "%s\n" \
                "pkgname = kuzpkg" \
                "pkgbase = kuzpkg" \
                "pkgver = ${PKGVER}" \
                "pkgrel = 1" \
                "pkgdesc = kuzpkg package manager" \
                "arch = armv7" \
                "license = GPL-2.0-or-later" \
                "packager = Kuznix Team" \
                "url = https://github.com/Kuznix-Team/kuzpkg" \
                "builddate = ${BUILD_DATE}" \
                > /tmp/pkg-root/.PKGINFO

              printf "%s\n" \
                "builddate = ${BUILD_DATE}" \
                "buildenv = kuzpkg-ci" \
                "format = kuzpkg-tar-zst" \
                "architecture = armv7" \
                > /tmp/pkg-root/.BUILDINFO

              # ------------------------------------------------
              # File list.
              # ------------------------------------------------

              find \
                /tmp/pkg-root \
                -mindepth 1 \
                -maxdepth 6 \
                -print \
                | sort \
                > /tmp/pkg-root/.FILELIST

              OUTPUT="/workspace/kuzpkg-${SAFE_TAG}-armv7-${PKGVER}.kuzpkg.tar.zst"

              # ------------------------------------------------
              # Create package.
              # ------------------------------------------------

              tar \
