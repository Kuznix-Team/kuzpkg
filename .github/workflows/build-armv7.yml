            --rm \
            --platform "$TARGET_PLATFORM" \
            "$TARGET_IMAGE" \
            sh -c '
              echo "Architecture:"
              uname -m

              echo "Userspace bits:"
              getconf LONG_BIT
            '

      - name: Build ARMv7 .kuzpkg.tar.zst
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          docker run \
            --rm \
            --platform "$TARGET_PLATFORM" \
            -e REPOSITORY="$REPOSITORY" \
            -v "$GITHUB_WORKSPACE/dist:/workspace" \
            -w /workspace \
            "$TARGET_IMAGE" \
            bash -euxo pipefail -c '

              # ------------------------------------------------
              # Dependencies.
              # ------------------------------------------------

              apt-get update

              apt-get install -y \
                ca-certificates \
                git \
                build-essential \
                meson \
                ninja-build \
                pkg-config \
                zstd \
                libarchive-dev \
                libcurl4-openssl-dev \
                libgpgme-dev \
                libssl-dev \
                nettle-dev \
                libseccomp-dev \
                file \
                gettext \
                tar

              # ------------------------------------------------
              # Everything except final output stays under /tmp.
              # ------------------------------------------------

              rm -rf \
                /tmp/kuzpkg \
                /tmp/kuzpkg-build \
                /tmp/pkg-root

              # ------------------------------------------------
              # Clone source.
              # ------------------------------------------------

              git clone \
                --depth 1 \
                --filter=blob:none \
                "$REPOSITORY" \
                /tmp/kuzpkg

              cd /tmp/kuzpkg

              git fetch \
                --tags \
                --depth=1 \
                origin

              GIT_TAG="$(
                git tag --sort=-creatordate |
                head -n 1
              )"

              if [ -z "$GIT_TAG" ]; then
                GIT_TAG="$(
                  git describe \
                    --tags \
                    --abbrev=0 \
                    2>/dev/null || true
                )"
              fi

              if [ -z "$GIT_TAG" ]; then
                echo "ERROR: No Git tag found."
                exit 1
              fi

              TAG_VERSION="${GIT_TAG#v}"

              DATE_VERSION="$(
                date -u +%Y%m%d
              )"

              ARCH_TAG_VERSION="$(
                printf "%s" "$TAG_VERSION" |
                tr "-" "."
              )"

              PKGVER="${ARCH_TAG_VERSION}.${DATE_VERSION}"

              SAFE_TAG="$(
                printf "%s" "$GIT_TAG" |
                sed \
                  "s#[/[:space:]]#-#g; s#[^A-Za-z0-9._+-]#-#g"
              )"

              echo "Git tag: ${GIT_TAG}"
